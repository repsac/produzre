# Acoustic Guitar - Style Comparison
#
# Four sections isolating each acoustic guitar technique:
#
#   picking_verse    - Travis fingerpicking (verse default)
#   strum_chorus     - Dense chord strumming (chorus default)
#   hybrid_prechorus - Arpeggio first half + strum second half
#   perc_breakdown   - Sparse body taps + chord stabs
#
# The acoustic_gtr engine auto-selects technique by section type, but
# each section here overrides it explicitly so all four are demonstrated
# in one file. Harmony only: no drums/bass/rhythm_gtr, acoustic only for clarity.

version: 1

song:
  project: produzre-examples
  title: "Acoustic Style Comparison"
  bpm: 92
  key: G
  mode: major
  meter: "4/4"
  beats_per_bar: 4
  seed: 777
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  harmony:
    params: {}
  acoustic_gtr:
    params: {}

sections:
  picking_verse:
    type: verse
    bars: 4
    harmony:
      progression: ["I", "IV", "V", "I"]
    instruments:
      harmony:
        intensity: 0.7
      acoustic_gtr:
        intensity: 0.7
        extra:
          technique: "fingerpicking"
          picking_pattern: "travis"
          voicing_style: "open"

  strum_chorus:
    type: chorus
    bars: 4
    harmony:
      progression: ["I", "IV", "V", "IV"]
    instruments:
      harmony:
        intensity: 0.8
      acoustic_gtr:
        intensity: 0.85
        extra:
          technique: "strumming"
          strum_density: 0.75
          voicing_style: "open"

  hybrid_prechorus:
    type: prechorus
    bars: 4
    harmony:
      progression: ["IV", "V", "vi", "V"]
    instruments:
      harmony:
        intensity: 0.75
      acoustic_gtr:
        intensity: 0.75
        extra:
          technique: "hybrid"
          picking_pattern: "broken_chord"
          voicing_style: "auto"

  perc_breakdown:
    type: breakdown
    bars: 4
    harmony:
      progression: ["I", "vi", "IV", "V"]
    instruments:
      harmony:
        intensity: 0.55
      acoustic_gtr:
        intensity: 0.55
        extra:
          technique: "percussive"
          body_tap_ratio: 0.35
          voicing_style: "open"

arrangement:
  - picking_verse
  - strum_chorus
  - hybrid_prechorus
  - perc_breakdown

# Verification checklist (analysis/acoustic_gtr/*.events.tsv, beats counted from 1):
# - fingerpicking: single notes, a thumb bass on each beat alternating with
#   treble notes on the off-beats, bass notes held longer than treble
# - strumming: full downstrokes of 4-5 strings (open chords, not power
#   chords) with lighter 2-3 string strokes between them, velocity ~70-100
# - hybrid: picked notes on beats 1 and 2, a 4-note strummed chord from beat 3
# - percussive: a soft 6-string stab on each downbeat (vel ~40-47), a very
#   short body tap (kind body_tap) around beat 3.5, and an occasional strum
# - Same seed -> same MIDI output (determinism check)
