# Passing tones: diatonic approaches, a scale step below each new root.
#
# passing-none, passing-diatonic and passing-chromatic share the pocket
# persona, an eighth-note drive pattern, the seed and the progression; only
# the approach settings differ. An approach note is the last note before a
# chord change, stepping into the next root (kind approach_diatonic or
# approach_chromatic in analysis/bass/*.events.tsv).
version: 1
song:
  project: produzre-examples
  title: "PassingTones_Diatonic"
  bpm: 120
  key: C
  mode: major
  meter: "4/4"
  beats_per_bar: 4
  seed: 504  # Same seed in passing-none, -diatonic and -chromatic
  variation: 0.0
  humanize_velocity: 0.0
  humanize_timing: 0.0
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

instruments:
  bass:
    enabled: true
    persona: pocket
    intensity: 0.7
    params:
      articulation_style: finger
      rhythm_pattern: drive  # Eighths: a note just before each change to approach from
      density: 0.7
      rest_rate: 0.1
      approach_rate: 0.8  # Approach most chord changes
      chromatic_rate: 0.0  # Only diatonic (scale-based)
      max_passing_per_bar: 2

sections:
  verse1:
    type: verse
    bars: 8
    harmony:
      progression: "I vi ii V I vi ii V"  # Targets A, D, G: scale and half steps differ
    instruments:
      harmony: {}
      bass: {}

arrangement:
  - verse1
