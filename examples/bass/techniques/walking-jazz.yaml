version: 1
song:
  project: produzre-examples
  title: "Walking_Jazz"
  bpm: 140
  key: C
  mode: major
  meter: "4/4"
  beats_per_bar: 4
  seed: 800  # Fixed seed for reproducibility
  variation: 0.0
  humanize_velocity: 0.0
  humanize_timing: 0.0
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

instruments:
  bass:
    enabled: true
    persona: walking  # A walking line: every beat sounds, a step into each change
    intensity: 0.75
    params:
      articulation_style: finger
      chromatic_rate: 0.25   # Share of half-step approaches (the rest are scale steps)

sections:
  verse1:
    type: verse
    bars: 8  # More bars for better walking pattern
    harmony:
      progression: "I vi ii V I vi ii V"  # Classic jazz progression
    instruments:
      harmony: {}
      bass: {}

arrangement:
  - verse1
