# Band with a singer: the lead guitar plays around the vocal.
#
# `foreground: auto` puts the lead behind a singer: no vocal part is
# rendered, and the song's hook stands in for the singer's line. Every lead
# phrase derives from one song DNA: a hook chosen by a memorability search
# over the chorus chords, a verse idea, a contrasting bridge idea, and a bank
# of three signature licks. The arrangement choices named below are drawn
# under the shared produzre-examples project, so every build hears them.
#
# Listen for:
#   - the intro states the guitar hook over the signature riff; the song is
#     riff-driven, so the bass doubles the riff in the intro, verses and outro
#   - verses leave room: signature licks only at phrase ends, and verse 2
#     repeats verse 1
#   - the prechorus climbs by sequence, and the band stops dead in its last
#     bar before each chorus (the drawn into-chorus device is `stop`)
#   - choruses follow the drawn chorus form `call`: the lead stays out of
#     each two-bar vocal line, answers it with a lick, and closes on the hook
#     as a tag. The second chorus repeats the first note for note; the final
#     chorus (`final_chorus: modulate`) moves up a whole step, and the outro
#     stays in the new key
#   - the bridge states its idea, then fills; the solo tells a melodic story
#     that ends on a held note, and the band stops again into the last chorus
#   - drums follow the section intensity: louder in choruses than verses, and
#     a little louder on each repeat
#   - `turnarounds: true` turns the intro's last half bar to bVII into the
#     verse; the song ends cold on the tonic
version: 1
song:
  project: produzre-examples
  title: "Composer Band"
  bpm: 128
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 2026
  turnarounds: true
  final_chorus: modulate
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  lead_gtr:
    params:
      foreground: auto
      register: [60, 79]
  bass:
    params: {articulation_style: pick}

sections:
  intro:
    type: intro
    bars: 4
    harmony: {progression: "i bVI bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  prechorus:
    type: prechorus
    bars: 4
    harmony: {progression: "iv bVI bVII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "i bVII bVI bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  bridge:
    type: bridge
    bars: 8
    harmony: {progression: "bVI bVII iv v"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  solo:
    type: solo
    bars: 8
    harmony: {progression: "i bVI bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "i bVI bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, prechorus, chorus, verse, prechorus, chorus, bridge, solo, chorus, outro]
