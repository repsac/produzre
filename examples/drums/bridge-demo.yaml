# Section intents: five contrast feels for bridges and breaks.
#
# A section `intent` asks for a specific drum feel. It is a part selector:
# that section's drums come from the drum engine instead of the composed
# drummer. Sections without an intent play the song's own drummer, so you
# hear each intent against the composed groove around it:
#
#   drop        sparse kick and snare, closed hats only, no syncopation
#   half_time   one snare in the middle of the bar, a heavier feel
#   build       fills at every phrase end, longer fills, more kick
#   open        ride instead of hats, spacious
#   stomp       heavy kicks, steady hats, a harder backbeat
#
# Bass and rhythm guitar stay composed throughout. An intent section plays
# at the composed drummer's level for its intensity, so the handoff does
# not jump in volume; the stomp breakdown sets `intensity: 0.85`, a choice
# so it lands hard instead of at a breakdown's default quiet level.
#
# Want a half-time bridge without leaving the composed drummer? Leave
# `intent` off: each song's drummer already draws its own bridge feel
# (often half-time), which section-types-demo.yaml shows.
version: 1
song:
  project: produzre-examples
  title: "Drum Section Intents"
  bpm: 140
  key: D
  mode: minor
  meter: "4/4"
  genre: hard_rock
  seed: 3802
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  bridge_drop:
    type: bridge
    intent: drop
    bars: 4
    harmony: {progression: "bVI bIII bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  bridge_half_time:
    type: bridge
    intent: half_time
    bars: 4
    harmony: {progression: "bVI bIII bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  bridge_build:
    type: bridge
    intent: build
    bars: 4
    harmony: {progression: "bVI bIII bVII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  chorus_open:
    type: chorus
    intent: open
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  breakdown_stomp:
    type: breakdown
    intent: stomp
    intensity: 0.85
    bars: 4
    harmony: {progression: "i i bVI bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "i bVI bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}

arrangement: [verse, bridge_drop, bridge_half_time, bridge_build, chorus, chorus_open, breakdown_stomp, outro]
