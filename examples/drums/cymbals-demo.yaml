# Cymbal voice controls: ride bell, splash and china, crash placements.
#
# `voices` is a part selector: every section here sets drum voices, so the
# classic drum engine plays them with its kit-voice controls instead of
# the composed drummer. See README.md for the composed drum demos.
#
#   verse_hats_crash        hats with a low crash rate (0.2): no crash here
#   chorus_ride_bell        the ride, with `bell_rate: 0.3` (a chance per ride
#                           bar) adding bell accents on the downbeat of two bars
#   bridge_splash_china     splash and china at their highest rates: both
#                           cymbals are rare by design (about one splash in
#                           two sections, a china only in a section's last bar);
#                           this seed plays one splash and a closing china
#   outro_crash_placements  a crash placed on beat 1
version: 1
song:
  project: produzre-examples
  title: "CymbalsDemo"
  bpm: 120
  key: C
  mode: major
  meter: "4/4"
  beats_per_bar: 4
  seed: 4040
  variation: 0.0
  humanize_velocity: 0.0
  humanize_timing: 0.0
  exports_root: "exports"
  pattern_bars: 2
  pattern_merge_repeats: true
  pattern_merge_max: 4

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  verse_hats_crash:
    type: verse
    bars: 4
    harmony:
      progression: "I vi IV V"
    instruments:
      drums:
        intensity: 0.4
        extra:
          voices:
            # Crash at section start, low rate for phrase end
            crash:
              rate: 0.2

  chorus_ride_bell:
    type: chorus
    bars: 4
    harmony:
      progression: "I V vi IV"
    instruments:
      drums:
        intensity: 0.8
        params:
          # Explicitly request ride cymbal instead of hats
          groove: "chorus_ride"
        extra:
          voices:
            # Ride bell accents for emphasis
            ride:
              bell_rate: 0.3

            # Higher crash rate at phrase ends
            crash:
              rate: 0.9

  bridge_splash_china:
    type: bridge
    bars: 4
    harmony:
      progression: "IV I V vi"
    instruments:
      drums:
        intensity: 0.6
        extra:
          voices:
            # Sparse splash and china for color
            cymbals:
              splash_rate: 1.0
              china_rate: 1.0

            # Moderate crash rate
            crash:
              rate: 0.5

  outro_crash_placements:
    type: outro
    bars: 2
    harmony:
      progression: "I I"
    instruments:
      drums:
        intensity: 0.3
        extra:
          voices:
            # Explicit crash placements (downbeat)
            crash:
              placements: ["1"]

arrangement:
  - verse_hats_crash
  - chorus_ride_bell
  - bridge_splash_china
  - outro_crash_placements
