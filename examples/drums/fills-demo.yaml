# Fills: how often the composed drummer fills, set with `fill_rate`.
#
# The drummer is composed from the song's drum DNA: a fill vocabulary of
# its own (toms, snare crescendos, around the kit, unisons, triplets) and a
# habit for how often it fills. `fill_rate` overrides that habit for one
# section. The four verses below play the same groove and chords, so only
# the fills change:
#
#   verse_no_fills  fill_rate 0     no fills at all, not even into the next section
#   verse_sparse    fill_rate 0.2   one big fill, in the last bar (every 8 bars)
#   verse_phrase    fill_rate 0.6   a fill every 4 bars: bars 4 and 8 (plus
#                                   one-beat fills if this drummer has that habit)
#   verse_busy      fill_rate 0.9   bars 4 and 8, plus one-beat fills in bars 2 and 6
#
# `arrangement_style` pins two song habits so the ends are the same on every
# machine: the last verse fills into the chorus (`into_chorus: fill`), and
# the song closes on a big finish (`ending: big`).
#
# Listen for:
#   - the kick, snare and hats stay locked with the bass and rhythm guitar;
#     only the phrase ends change
#   - the chorus has no fill_rate, so it plays the song's own fill habit
#
# Check it: analysis/drums/*.events.tsv marks fill hits with kind "fill".
version: 1
song:
  title: "Composed Drum Fills"
  bpm: 112
  key: A
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 3167
  arrangement_style: {into_chorus: fill, ending: big}
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

sections:
  verse_no_fills:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.0}}
      bass: {}
      rhythm_gtr: {}
  verse_sparse:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.2}}
      bass: {}
      rhythm_gtr: {}
  verse_phrase:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.6}}
      bass: {}
      rhythm_gtr: {}
  verse_busy:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.9}}
      bass: {}
      rhythm_gtr: {}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "bVI bVII i i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}

arrangement: [verse_no_fills, verse_sparse, verse_phrase, verse_busy, chorus]
