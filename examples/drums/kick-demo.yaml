sections:
  tight_rock:
    type: verse
    bars: 4
    harmony:
      progression: "I IV V I"
    instruments:
      drums:
        intensity: 0.7
        extra:
          voices:
            kick:
              # Tight rock kick with controlled syncopation
              syncopation:
                rate: 0.4
                placements: ["1&", "2&", "3&", "4&"]

              # No doubles for tight rock
              double:
                rate: 0.0

  metal_doubles:
    type: chorus
    bars: 4
    harmony:
      progression: "I V vi IV"
    instruments:
      drums:
        intensity: 0.9
        extra:
          voices:
            kick:
              # Aggressive syncopation for metal
              syncopation:
                rate: 0.8
                placements: ["1e", "1&", "2e", "2&", "3e", "3&", "4e", "4&"]

              # Heavy double-kick
              double:
                rate: 1.0
                placements: ["4e", "4&", "4a"]

  groove_shuffle:
    type: bridge
    bars: 4
    harmony:
      progression: "IV I V vi"
    instruments:
      drums:
        intensity: 0.6
        extra:
          voices:
            kick:
              # Moderate syncopation for groove
              syncopation:
                rate: 0.5
                placements: ["2&", "4e"]

              # Occasional doubles for fills
              double:
