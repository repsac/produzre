# Phrasing: where the composed drummer marks phrase ends.
#
# The composed drummer thinks in four-bar phrases. Groove memory repeats
# the section's main bar through each phrase, and the phrase's last bar is
# where the fill goes. The last bar of a section belongs to the transition
# into the next one. Section length and meter decide where those bars fall:
#
#   verse        8 bars    fills in bars 4 and 8
#   chorus       8 bars    fill_rate 0.9: one-beat fills in bars 2 and 6 as well
#   bridge       6 bars    bar 4 ends a phrase, bar 6 ends the section
#   solo         12 bars   bars 4, 8 and 12 (a 12-bar blues form)
#   verse_68     8 bars    6/8: two dotted-quarter pulses per bar, same phrasing
#   outro_78     4 bars    7/8 (2+2+3): the ending lands on a grouped bar
#
# Every section but the chorus sets fill_rate 0.6 (a fill every four bars),
# so the only thing that changes is the section's length or meter. A
# drummer with a one-beat fill habit would also add short fills in
# between; this song's drummer has none, so only the chorus has them.
# `into_chorus: fill` and `ending: ring` are pinned, so the 7/8 outro's
# last bar is the ringing ending rather than a fill.
#
# Check it: analysis/drums/*.events.tsv marks fill hits with kind "fill".
# Its bar numbers follow the song's 4/4 grid, so the 6/8 and 7/8 fills sit
# at shorter spacings there; `start_beat_abs` gives the exact position.
version: 1
song:
  project: produzre-examples
  title: "Composed Drum Phrasing"
  bpm: 104
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 3304
  arrangement_style: {into_chorus: fill, ending: ring}
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony: {progression: "i bVII bVI bVII"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.6}}
      bass: {}
      rhythm_gtr: {}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "bVI bVII i i"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.9}}
      bass: {}
      rhythm_gtr: {}
  bridge:
    type: bridge
    bars: 6
    harmony: {progression: "iv iv bVI bVI bVII bVII"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.6}}
      bass: {}
      rhythm_gtr: {}
  solo:
    type: solo
    bars: 12
    harmony: {progression: "i i i i iv iv i i v iv i v"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.6}}
      bass: {}
      rhythm_gtr: {}
  verse_68:
    type: verse
    meter: "6/8"
    bars: 8
    harmony: {progression: "i bVII bVI bVII"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.6}}
      bass: {}
      rhythm_gtr: {}
  outro_78:
    type: outro
    meter: "7/8"
    bars: 4
    harmony: {progression: "i bVII bVI i"}
    instruments:
      harmony: {}
      drums: {params: {fill_rate: 0.6}}
      bass: {}
      rhythm_gtr: {}

arrangement: [verse, chorus, bridge, solo, verse_68, outro_78]
