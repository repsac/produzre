# Section types: the composed drummer plays a groove per section type.
#
# Each song's drummer draws a right-hand timekeeper (closed or open hats,
# sixteenths, quarters, ride, ride bell, crash-ride, floor-tom pulse, pedal
# hat, washy hats) and a backbeat (backbeat, half-time or stomp) for every
# section type. The verse and chorus always contrast, and bridges and
# breakdowns lean toward half-time. The build log names each choice:
#
#   [INFO] Composer: chorus drums play hat8_open/backbeat
#
# The section type decides what the composed drummer plays. Section
# intensity decides how hard it plays: every section type has a default
# (intro and breakdown soft, choruses loudest) and a repeat plays a little
# harder, so the second chorus sits above the first. The song closes with
# a big finish (`ending: big`); the other habits are this song's own draw.
#
# Listen for:
#   - the guitar plays the intro alone at first (this song's riff-alone
#     intro); the drums enter halfway with a fill and a crash
#   - the hands change at every section boundary: washy hats in the intro,
#     ride in the verse, floor tom in the prechorus, open hats in the
#     chorus, ride again in the bridge, ride bell over a half-time snare in
#     the breakdown
#   - the kick keeps the song's own two patterns (one for verse-like
#     sections, a busier one for chorus, solo and outro)
#   - the band pushes into each chorus (this song's way in): crash and kick
#     on the last "and", ringing over the downbeat; every other section
#     starts with a crash
#   - bass and rhythm guitar change figures with the drummer at every section
