# Rock drum feature: a full song form played by the drums alone.
#
# Nothing about the kit is authored, so the composed drummer plays it: the
# song seed draws one drummer (kick pattern, what the hands ride in each
# section, ghost notes, fill habits, crash habits and a feel), and the
# arrangement planner decides where the fills, pickups and crashes land.
# Only feel settings are given (ghost_rate, fill_rate), which
# shape the composed drummer instead of replacing it, plus two arrangement
# pins (song.arrangement_style) for the chorus entrances and the ending.
#
# Listen for:
#   - the intro states the groove, then a fill kicks off verse 1
#   - verses keep the foot pattern steady while bars 2 and 4 of each phrase
#     answer the snare figure on the toms
#   - the prechorus moves the hands to the ride, and a fill plus crash
#     marks every chorus entrance (into_chorus: fill)
#   - choruses open the hands up to sixteenth-note hats
#   - the drum solo section moves to the ride with small fills every two
#     bars (fill_rate 0.8) and bigger ones at the phrase ends
#   - the bridge drops to a half-time feel on the hi-hat foot, with busier
#     ghost notes (ghost_rate 0.45), before the last chorus
#   - the outro ends big with a closing fill and crash (ending: big)
version: 1
song:
  title: "Solo Drums Rock Feature"
  bpm: 124
  key: A
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 4101
  arrangement_style:
    into_chorus: fill
    ending: big
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  drums:
    params:
      ghost_rate: 0.2
      fill_rate: 0.6

sections:
  intro:
    type: intro
    bars: 4
    instruments:
      drums: {}
  verse:
    type: verse
    bars: 8
    instruments:
      drums: {}
  prechorus:
    type: prechorus
    bars: 4
    instruments:
      drums: {}
  chorus:
    type: chorus
    bars: 8
    instruments:
      drums: {}
  solo:
    type: solo
    bars: 8
    instruments:
      drums: {params: {fill_rate: 0.8}}
  bridge:
    type: bridge
    bars: 8
    instruments:
      drums: {params: {ghost_rate: 0.45}}
  outro:
    type: outro
    bars: 4
    instruments:
      drums: {}

arrangement: [intro, verse, prechorus, chorus, verse, prechorus, chorus, solo, bridge, chorus, outro]
