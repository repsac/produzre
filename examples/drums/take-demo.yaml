# Takes and drummer seeds: a new performance, or a new drummer.
#
# Two ways to hear the drums differently without touching the song:
#
#   song.take     a new performance of the same parts. The drummer's
#                 patterns, fills and ghost notes stay; the timing and
#                 velocity humanization are drawn again (the bass engine
#                 may also pick some new notes). Change `take: 0` below to
#                 1, 2, 3... and rebuild: every take is repeatable.
#   drums seed    a new drummer. An instrument `seed` re-rolls that part's
#                 drum DNA (kick patterns, hands per section, ghosts, fill
#                 vocabulary, feel). Here the second verse and chorus give
#                 the drums `seed: 5`. The rhythm guitar keeps the song's
#                 verse figure; the bass locks to the kick in the verses,
#                 so it follows the new drummer's kick there.
#
# Listen for: the song's drummer (eighth-note hats in the verse, washy
# hats over a stomping backbeat in the chorus, a laid-back feel), then the
# new drummer on the same sections: sixteenth-note hats with ghost notes
# in the verse, ride with bell accents in the chorus, another kick
# pattern, and straight time.
version: 1
song:
  project: produzre-examples
  title: "Drummer Takes and Seeds"
  bpm: 116
  key: C
  mode: major
  meter: "4/4"
  genre: pop_rock
  seed: 3701
  take: 0
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony: {progression: "I V vi IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "IV I V vi"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  verse_new_drummer:
    type: verse
    bars: 8
    harmony: {progression: "I V vi IV"}
    instruments: {harmony: {}, drums: {seed: 5}, bass: {}, rhythm_gtr: {}}
  chorus_new_drummer:
    type: chorus
    bars: 8
    harmony: {progression: "IV I V vi"}
    instruments: {harmony: {}, drums: {seed: 5}, bass: {}, rhythm_gtr: {}}

arrangement: [verse, chorus, verse_new_drummer, chorus_new_drummer]
