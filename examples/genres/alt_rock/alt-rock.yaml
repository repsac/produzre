# Alternative rock: a mixolydian verse and a big chorus in E at 124 BPM.
#
# The verse borrows the flat seventh (E, D, A) for that open alt-rock
# jangle, the prechorus turns to the relative minor, and the chorus lands
# on IV to start its lift. The lead guitar plays around an imagined singer
# (foreground: auto); under the chorus it plays octave lines, a signature
# alt-rock lead sound.
#
# Pinned, and why:
#   - counter: octaves, the lead's octave melody under the singer's chorus
#   - comp_activity: sparse, so the rhythm guitar states its figure and
#     leaves air in the verses
#   - drums hat_density 0.85: a slightly lighter top cymbal line
# The drummer, bass role, into-chorus device and licks come from the seed.
#
# Listen for:
#   - the D chord (bVII) giving the verse its open, modal sound
#   - octave lines under the chorus, then the hook as a tag
#   - the bridge on ii, IV, vi, V, then a solo that sets up the last chorus
version: 1
song:
  title: "Radio Tower Weather"
  bpm: 124
  key: E
  mode: major
  meter: "4/4"
  genre: alt_rock
  seed: 7382
  turnarounds: true
  exports_root: "exports"
  arrangement_style:
    counter: octaves
    comp_activity: sparse

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  lead_gtr:
    params:
      foreground: auto
      register: [59, 81]
  drums:
    params: {hat_density: 0.85}

