# Blues: a 12-bar shuffle in A with a singer, answered by the guitar.
#
# Every verse is the full 12-bar form with dominant sevenths and a quick
# change to IV in bar 2. The lead guitar plays around an imagined singer
# (foreground: auto), so it answers each vocal line with a lick in the
# second bar of the phrase, then takes a whole chorus as a solo. The bass
# walks quarter notes through every bar of the form.
#
# Pinned, and why:
#   - groove swing 0.66: an exact triplet shuffle for the whole band (the
#     composed blues drummer already shuffles, a little straighter)
#   - solo_story: blues, a slow-blues solo built on the song's licks
#   - bass rhythm_pattern: walking, a walking line under the shuffle
# The drummer, the comp figures and the licks are drawn from the seed
# (examples use the shared produzre-examples project).
#
# Listen for:
#   - the intro starts on the V7 turnaround, like a band counting in
#   - guitar licks fill the gaps between the singer's lines in each verse
#   - bars 9 to 12 turn around (V7 IV7 I7 V7) back to the top of the form
#   - every verse answering the singer with the same licks, a band's
#     arranged part
#   - the solo chorus, the drummer moving to the ride under it, then a
#     last verse and a short tag ending on I7
version: 1
song:
  project: produzre-examples
  title: "Lowdown Kitchen Shuffle"
  bpm: 96
  key: A
  mode: major
  meter: "4/4"
  genre: blues
  seed: 7331
  exports_root: "exports"
  arrangement_style:
    solo_story: blues

groove:
  swing: 0.66

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  lead_gtr:
    params:
      foreground: auto
      register: [57, 81]
  bass:
    params: {rhythm_pattern: walking}

sections:
  intro:
    type: intro
    bars: 4
    harmony: {progression: "V7 IV7 I7 V7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse:
    type: verse
    bars: 12
    harmony: {progression: "I7 IV7 I7 I7 IV7 IV7 I7 I7 V7 IV7 I7 V7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  solo:
    type: solo
    bars: 12
    harmony: {progression: "I7 IV7 I7 I7 IV7 IV7 I7 I7 V7 IV7 I7 V7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "I7 IV7 I7 I7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, verse, solo, verse, outro]
