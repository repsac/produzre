# Blues rock: a riff in E, a 12-bar solo, and a singer's chorus.
#
# A signature riff drives the intro, verses and outro, with the bass
# doubling it an octave down so guitar and bass hit every accent together.
# The verse is an 8-bar blues on E7 and A7, the chorus lifts through the
# rock move bVI bVII, and the solo is a full 12-bar blues chorus. The lead
# guitar plays around an imagined singer (foreground: auto).
#
# Pinned, and why:
#   - riff_driven and bass_doubles: blues rock lives on the riff played in
#     unison by guitar and bass
#   - solo_story: blues, so the solo is built from the song's blues licks
#   - turnarounds: true, the V7 turnaround back into each section
# The drummer, feel, chorus figures and licks are drawn from the seed.
#
# Listen for:
#   - the riff with the bass locked underneath it
#   - the chorus lifting through C and D (bVI bVII) with the bass pumping
#     octaves
#   - the 12-bar solo telling a blues story, then a final chorus and the
#     riff again in the outro
