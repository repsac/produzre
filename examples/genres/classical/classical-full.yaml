# Classical Full Arrangement - Intermediate Example
#
# Multi-section classical piece in D minor with contrasting dynamics
# from pp to ff. Rich harmonic progressions using i-iv-V-i movement
# and Neapolitan color. No drums or guitar -- bass and harmony only.
#
# Complexity: INTERMEDIATE (multiple contrasting sections, wide dynamic range)

version: 1

song:
  title: "Sonata in D Minor"
  bpm: 75
  key: D
  mode: minor
  meter: "4/4"
  genre: classical
  seed: 750
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  bass:
    params:
      articulation_style: "finger"

sections:
  exposition:
    type: intro
    bars: 8
    harmony:
      progression: ["i", "iv", "V", "i", "i", "iv", "V7", "i"]
    instruments:
      harmony:
        intensity: 0.4
      bass:
        intensity: 0.35

  theme_a:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "iv", "V7", "i", "III", "VI", "V7", "i"]
    instruments:
      harmony:
        intensity: 0.6
      bass:
        intensity: 0.55

  development:
    type: bridge
    bars: 8
    harmony:
      progression: ["iv", "V7", "III", "VI", "bII", "V7", "i", "V7"]
    instruments:
      harmony:
        intensity: 0.9
      bass:
        intensity: 0.85

  theme_b:
    type: verse
    bars: 8
    harmony:
      progression: ["III", "VI", "iv", "V7", "i", "iv", "V7", "i"]
    instruments:
      harmony:
        intensity: 0.7
      bass:
        intensity: 0.65

  recapitulation:
    type: chorus
    bars: 8
    harmony:
      progression: ["i", "iv", "V7", "i", "iv", "bII", "V7", "i"]
    instruments:
      harmony:
        intensity: 0.5
      bass:
        intensity: 0.45

  coda:
    type: outro
    bars: 4
    harmony:
      progression: ["iv", "V7", "i", "i"]
    instruments:
      harmony:
        intensity: 0.3
      bass:
        intensity: 0.25

arrangement:
  - exposition
  - theme_a
  - development
  - theme_b
  - recapitulation
  - coda
