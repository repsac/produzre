# Simple Classical - Beginner Example
#
# Minimal classical piece in C major with just bass and harmony.
# No drums or guitar -- pure tonal writing at a moderate tempo.
#
# Complexity: SIMPLE (1 section, minimal instrumentation)

version: 1

song:
  title: "Aria in C"
  bpm: 80
  key: C
  mode: major
  meter: "4/4"
  genre: classical
  seed: 700
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  theme:
    type: verse
    bars: 8
    harmony:
      progression: ["I", "IV", "V", "I"]
    instruments:
      harmony:
        intensity: 0.6
      bass:
        intensity: 0.5

arrangement:
  - theme
  - theme
