# Dance Pop Full Arrangement - Advanced Example
#
# Full dance pop song in Bb major at 128 BPM. Features build-up sections
# leading into big choruses, a stripped-back breakdown, and a high-energy
# finale. Four-on-the-floor throughout.
#
# Complexity: ADVANCED (full arrangement, build-ups and breakdowns)

version: 1

