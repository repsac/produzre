# Electronic - Simple Example
#
# Synth-driven electronic track in A minor at 130 BPM. Dark, pulsing
# energy with a simple minor progression.
#
# Complexity: SIMPLE (1 section, minimal configuration)

version: 1

song:
  title: "Signal"
  bpm: 130
  key: A
  mode: minor
  meter: "4/4"
  genre: electronic
  seed: 500
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  main:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "III", "VII"]
    instruments:
      harmony:
        intensity: 0.8
      drums:
        intensity: 0.8
      bass:
        intensity: 0.85
      rhythm_gtr:
        intensity: 0.6

arrangement:
  - main
  - main
