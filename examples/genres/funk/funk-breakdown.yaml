# Funk Breakdown - Advanced Example
#
# Full funk arrangement with multiple breakdowns and bridge contrast.
# genre: funk drives all recipe parameters; section-level intensity
# and bass overrides shape the dynamics.
#
# Complexity: ADVANCED (full arrangement, multiple breakdowns)

version: 1

song:
  title: "Funky Breakdown"
  bpm: 108
  key: F
  mode: minor
  meter: "4/4"
  genre: funk
  seed: 900
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  drums:
    persona: "funk-lite"
  bass:
    params:
      rhythm_pattern: "syncopated"
      articulation_style: "slap"
      passing_tone_rate: 0.2

sections:
  intro:
    type: intro
    bars: 8
    harmony:
      progression: ["i", "i", "i", "i"]
    instruments:
      harmony:
        intensity: 0.6
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.5

  verse_1:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "IV", "i", "IV"]
    instruments:
      harmony:
        intensity: 0.85
      drums:
        intensity: 0.85
      bass:
        intensity: 0.85
      rhythm_gtr:
        intensity: 0.8

  breakdown_1:
    type: breakdown
    bars: 4
    harmony:
      progression: ["i", "VII"]
    instruments:
      harmony:
        intensity: 0.95
      drums:
        intensity: 0.95
      bass:
        intensity: 0.95
      rhythm_gtr:
        intensity: 0.9

  verse_2:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "IV", "i", "IV"]
    instruments:
      harmony:
        intensity: 0.9
      drums:
        intensity: 0.9
      bass:
        intensity: 0.9
      rhythm_gtr:
        intensity: 0.85

  bridge:
    type: bridge
    bars: 8
    harmony:
      progression: ["VI", "VII", "i", "VII"]
    instruments:
      harmony:
        intensity: 0.85
      drums:
        intensity: 0.8
      bass:
        intensity: 0.8
        params:
          rhythm_pattern: "anchor"
      rhythm_gtr:
        intensity: 0.8

  breakdown_2:
    type: breakdown
    bars: 8
    harmony:
      progression: ["i", "VII", "i", "VII"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 1.0
      bass:
        intensity: 1.0
      rhythm_gtr:
        intensity: 0.95

  outro:
    type: outro
    bars: 8
    harmony:
      progression: ["i", "i", "i", "i"]
    instruments:
      harmony:
        intensity: 0.6
      drums:
        intensity: 0.6
      bass:
        intensity: 0.6
      rhythm_gtr:
        intensity: 0.5

arrangement:
  - intro
  - verse_1
  - breakdown_1
  - verse_2
  - bridge
  - breakdown_2
  - verse_1
  - outro
