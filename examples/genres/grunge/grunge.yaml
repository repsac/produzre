# Grunge: quiet verse, loud chorus, in D minor at 116 BPM, with a singer.
#
# The soft-loud dynamic is the point: verses sit low (intensity 0.5) with
# the riff ticking over half-time drums, then the chorus slams in at full
# intensity with the bass pumping octaves. The harmony mixes minor with
# the major IV and bIII power-chord moves grunge borrowed from punk. The
# lead guitar plays around an imagined singer (foreground: auto), stabs
# under the chorus, and its solo follows the vocal melody, grunge style,
# before ending in a whammy dive.
#
# Pinned, and why:
#   - riff_driven: a low signature riff in the intro, verses and outro
#   - intro: riff_alone, the riff by itself before the band comes in
#   - into_chorus: build, so the band swells into each loud chorus
#   - solo_story: melodic, the solo plays the tune rather than shredding
#   - section intensities for the soft-loud contrast
# The drummer, bass roles, figures and licks are drawn from the seed
# (examples use the shared produzre-examples project).
#
# Listen for:
#   - the riff alone and quiet, a drum pickup, then the band
#   - a snare build and driving bass eighths into a loud chorus
#   - the chorus power chords over i iv bIII bVI
#   - a half-time bridge on the floor tom, then a melodic solo on the hook
#   - the final chorus louder again, then the riff to close
version: 1
song:
  project: produzre-examples
  title: "Wet Flannel Static"
  bpm: 116
  key: D
  mode: minor
  meter: "4/4"
  genre: grunge
  seed: 7372
  turnarounds: true
  exports_root: "exports"
  arrangement_style:
    riff_driven: true
    intro: riff_alone
    into_chorus: build
    solo_story: melodic

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  lead_gtr:
    params:
      foreground: auto
      register: [57, 79]
  bass:
    params: {articulation_style: pick}

sections:
  intro:
    type: intro
    bars: 4
    intensity: 0.5
    harmony: {progression: "i bVII bIII IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse:
    type: verse
    bars: 8
    intensity: 0.5
    harmony: {progression: "i bVII bIII IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    intensity: 1.0
    harmony: {progression: "i iv bIII bVI"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  bridge:
    type: bridge
    bars: 8
    intensity: 0.6
    harmony: {progression: "bVI bVII bVI bVII bVI bVII IV IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  solo:
    type: solo
    bars: 8
    intensity: 0.85
    harmony: {progression: "i bVII bIII IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 4
    intensity: 0.6
    harmony: {progression: "i bVII bIII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, chorus, verse, chorus, bridge, solo, chorus, outro]
