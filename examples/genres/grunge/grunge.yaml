# Grunge: quiet verse, loud chorus, in D minor at 116 BPM, with a singer.
#
# The soft-loud dynamic is the point: verses sit low (intensity 0.5) with
# the riff ticking over, then the chorus slams in at full intensity. The
# harmony mixes minor with the major IV and bIII power-chord moves grunge
# borrowed from punk. The lead guitar plays around an imagined singer
# (foreground: auto) and its solo restates the vocal melody, grunge style.
#
# Pinned, and why:
#   - riff_driven: a low signature riff in the intro, verses and outro
#   - into_chorus: build, so the band swells into each loud chorus
#   - solo_story: melodic, the solo plays the tune rather than shredding
#   - section intensities for the soft-loud contrast
# The drummer, bass role, figures and licks are drawn from the seed.
#
# Listen for:
#   - the riff alone and quiet, then a build into a loud chorus
#   - the chorus power chords over i iv bIII bVI
#   - a half-time bridge, then a melodic solo quoting the hook
#   - the final chorus louder again, then the riff to close
version: 1
song:
  title: "Wet Flannel Static"
  bpm: 116
  key: D
  mode: minor
  meter: "4/4"
  genre: grunge
  seed: 7372
  turnarounds: true
  exports_root: "exports"
  arrangement_style:
    riff_driven: true
    into_chorus: build
    solo_story: melodic

