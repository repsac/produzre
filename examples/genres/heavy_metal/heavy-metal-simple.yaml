# Heavy Metal - Simple Example
#
# Aggressive double-kick feel in E minor at 160 BPM. High intensity
# throughout with pick bass locked to the kick drum.
#
# Complexity: SIMPLE (1 section, minimal configuration)

version: 1

song:
