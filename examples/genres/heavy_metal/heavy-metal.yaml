# Heavy metal: a chugging riff in E minor at 168 BPM, with a singer.
#
# Classic heavy metal: one signature riff on the low strings, doubled by
# the bass, a harmonic-minor V chord for tension, a big chorus, and a solo
# that ends in a whammy dive. The lead guitar plays around an imagined
# singer (foreground: auto).
#
# Pinned, and why:
#   - riff_driven and bass_doubles: guitar and bass play the riff together
#   - intro: riff_alone, the riff by itself before the band crashes in
#   - solo_story: trade and solo_ending: dive, the metal solo habit
#   - drums kick_density 1.3 and ghost_rate 0.05: a busier kick and a
#     straight snare, no funky ghost notes
# The drummer's grooves, the bass roles, the comp figures and the licks
# come from the seed (examples use the shared produzre-examples project).
#
# Listen for:
#   - the riff alone for two bars, a drum pickup, then the whole band
#     locked to it
#   - the riff under the verse; in the chorus, power chords and chugs over
#     sixteenth hats with the bass locked to the kick
#   - the prechorus stopping dead on its last downbeat before each chorus
#   - the major V (B) in the prechorus and bridge pulling back to E minor
#   - the solo trading phrases with the band and ending in a dive, then a
#     last chorus
version: 1
song:
  project: produzre-examples
  title: "Anvil of the Night"
  bpm: 168
  key: E
  mode: minor
  meter: "4/4"
  genre: heavy_metal
  seed: 7361
  turnarounds: true
  exports_root: "exports"
  arrangement_style:
    riff_driven: true
    bass_doubles: true
    intro: riff_alone
    solo_story: trade
    solo_ending: dive

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

