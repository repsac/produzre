# Jazz Swing - Advanced Example
#
# Full jazz standard form with AABA head, solo chorus, and trading section.
# genre: jazz loads swing drums, shell voicings, and jazz harmony.
# jazz-lite persona adds swing feel and ride-heavy drumming.
#
# Complexity: ADVANCED (full AABA form, solo chorus, trading)

version: 1

song:
  title: "Autumn Swing"
  bpm: 160
  key: Eb
  mode: major
  meter: "4/4"
  genre: jazz
  seed: 1200
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  drums:
    persona: "jazz-lite"
  bass:
    params:
      articulation_style: "finger"
      motion_style: "stepwise"
      passing_tone_rate: 0.5

sections:
  intro:
    type: intro
    bars: 8
    harmony:
      progression: ["I", "VI", "ii", "V", "iii", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.6
      drums:
        intensity: 0.6
      bass:
        intensity: 0.6
      rhythm_gtr:
        intensity: 0.5

  head_a1:
    type: verse
    bars: 8
    harmony:
      progression: ["I", "VI", "ii", "V", "iii", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.8
      drums:
        intensity: 0.8
      bass:
        intensity: 0.8
      rhythm_gtr:
        intensity: 0.75

  head_a2:
    type: verse
    bars: 8
    harmony:
      progression: ["I", "VI", "ii", "V", "iii", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.8
      drums:
        intensity: 0.8
      bass:
        intensity: 0.8
      rhythm_gtr:
        intensity: 0.75

  head_b:
    type: bridge
    bars: 8
    harmony:
      progression: ["IV", "IV", "VII", "iii", "VI", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.85
      drums:
        intensity: 0.85
      bass:
        intensity: 0.85
      rhythm_gtr:
        intensity: 0.8

  solo_chorus:
    type: solo
    bars: 32
    harmony:
      progression: [
        "I", "VI", "ii", "V", "iii", "VI", "ii", "V",
        "I", "VI", "ii", "V", "iii", "VI", "ii", "V",
        "IV", "IV", "VII", "iii", "VI", "VI", "ii", "V",
        "I", "VI", "ii", "V", "iii", "VI", "ii", "V"
      ]
    instruments:
      harmony:
        intensity: 0.9
      drums:
        intensity: 0.85
      bass:
        intensity: 0.9
      rhythm_gtr:
        intensity: 0.7
      lead_gtr:
        intensity: 0.85
        solo: true
        extra:
          phrase_len_bars: 4
          contour_style: "stepwise"
          resolution_strength: 0.75
          rest_probability: 0.15

  trading:
    type: breakdown
    bars: 16
    harmony:
      progression: ["I", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.85
      drums:
        intensity: 0.9
      bass:
        intensity: 0.85
      rhythm_gtr:
        intensity: 0.75

  outro:
    type: outro
    bars: 8
    harmony:
      progression: ["I", "VI", "ii", "V", "iii", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.6

arrangement:
  - intro
  - head_a1
  - head_a2
  - head_b
  - head_a1
  - solo_chorus
  - trading
  - head_a1
  - head_a2
  - head_b
  - head_a1
  - outro
