# Jazz Walking Bass - Intermediate Example
#
# Classic AABA form with walking bass and comping rhythm guitar.
# genre: jazz loads swing drums and sparse shell voicings automatically.
#
# Complexity: INTERMEDIATE (AABA form, walking bass)

version: 1

song:
  title: "Walking in Jazz"
  bpm: 150
  key: Bb
  mode: major
  meter: "4/4"
  genre: jazz
  seed: 1100
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  drums:
    persona: "jazz-lite"
  bass:
    params:
      articulation_style: "finger"
      motion_style: "stepwise"
      passing_tone_rate: 0.4

sections:
  intro:
    type: intro
    bars: 4
    harmony:
      progression: ["I", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.6
      drums:
        intensity: 0.6
      bass:
        intensity: 0.6
      rhythm_gtr:
        intensity: 0.5

  a_section:
    type: verse
    bars: 8
    harmony:
      progression: ["I", "VI", "ii", "V", "I", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.75
      drums:
        intensity: 0.75
      bass:
        intensity: 0.75
      rhythm_gtr:
        intensity: 0.7

  b_section:
    type: bridge
    bars: 8
    harmony:
      progression: ["IV", "IV", "ii", "V", "I", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.8
      drums:
        intensity: 0.8
      bass:
        intensity: 0.8
      rhythm_gtr:
        intensity: 0.75

  outro:
    type: outro
    bars: 4
    harmony:
      progression: ["I", "VI", "ii", "V"]
    instruments:
      harmony:
        intensity: 0.6
      drums:
        intensity: 0.6
      bass:
        intensity: 0.6
      rhythm_gtr:
        intensity: 0.5

arrangement:
  - intro
  - a_section
  - a_section
  - b_section
  - a_section
  - outro
