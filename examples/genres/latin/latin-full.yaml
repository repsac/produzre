# Latin Full Arrangement - Intermediate Example
#
# Vibrant latin arrangement in D minor with syncopated bass lines,
# bright harmony, and percussion-forward energy. Builds from a
# rhythmic intro to a fiery chorus with montuno-style momentum.
#
# Complexity: INTERMEDIATE (verse-chorus with breakdown)

version: 1

song:
  title: "Candela"
  bpm: 110
  key: D
  mode: minor
  meter: "4/4"
  genre: latin
  seed: 950
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  bass:
    params:
      articulation_style: "finger"
      rhythm_pattern: "syncopated"

sections:
  intro:
    type: intro
    bars: 4
    harmony:
      progression: ["i", "V7"]
    instruments:
      harmony:
        intensity: 0.55
      drums:
        intensity: 0.7
      bass:
        intensity: 0.6
      rhythm_gtr:
        intensity: 0.55

  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "iv", "V7", "i"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.8
      bass:
        intensity: 0.75
      rhythm_gtr:
        intensity: 0.7

  chorus:
    type: chorus
    bars: 8
    harmony:
      progression: ["III", "VI", "iv", "V7", "i", "iv", "V7", "i"]
    instruments:
      harmony:
        intensity: 0.85
      drums:
        intensity: 0.9
      bass:
        intensity: 0.85
      rhythm_gtr:
        intensity: 0.85

  breakdown:
    type: breakdown
    bars: 8
    harmony:
      progression: ["i", "i", "iv", "V7"]
    instruments:
      harmony:
        intensity: 0.6
      drums:
        intensity: 0.85
      bass:
        intensity: 0.8
      rhythm_gtr:
        intensity: 0.5

  outro:
    type: outro
    bars: 4
    harmony:
      progression: ["iv", "V7", "i", "i"]
    instruments:
      harmony:
        intensity: 0.5
      drums:
        intensity: 0.6
      bass:
        intensity: 0.55
      rhythm_gtr:
        intensity: 0.5

arrangement:
  - intro
  - verse
  - chorus
  - verse
  - breakdown
  - chorus
  - outro
