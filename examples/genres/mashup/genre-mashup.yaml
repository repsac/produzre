# Genre mashup: one song in E minor that changes genre section by section.
#
# The song is rock (song.genre), so the intro, the choruses and the outro
# are played by the composer's rock band: a composed drummer, composed
# comping, and a lead guitar that plays around a singer (foreground: auto).
# The other sections switch genre with a section instrument `genre`, which
# chooses that genre's composed player for the part in that section:
#   - the verses go reggae: a reggae drummer (kick and rim on 3 under open
#     hats), a skank on the rhythm guitar (offbeat chucks and stabs), and a
#     reggae bass that plays two or three notes a bar
#   - the bridge goes jazz: the jazz drummer (spang-a-lang on the closed
#     hi-hat, hi-hat foot on 2 and 4, swing that reaches the whole band in
#     that section), a real walking bass and a jazz comp over seventh chords
#   - the solo goes metal: a metal drummer on the ride and bell with a
#     syncopated kick, palm-muted chugs and power chords, a busy bass line,
#     and a lead that draws its solo licks from metal
# Each genre's player is seeded from the song, so both reggae verses share
# one reggae band. Arrangement habits (the push into each chorus, the cold
# ending) stay the song's, so the band still agrees on them. All sections
# share one key, one tempo and the song's hook, which ties the song
# together.
#
# Listen for:
#   - the rock intro and chorus against the offbeat skank of the verse
#   - the bridge swinging, with a walking bass under iv7 bVII7 bIIImaj7
#   - the solo over chugs and a metal beat, then back to the rock chorus
version: 1
song:
  project: produzre-examples
  title: "Crossfade City"
  bpm: 100
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 4242
  turnarounds: true
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  lead_gtr:
    params:
      foreground: auto
      register: [59, 81]

sections:
  intro:
    type: intro
    bars: 4
    harmony: {progression: "i bVI bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse_reggae:
    type: verse
    bars: 8
    harmony: {progression: "i iv i iv"}
    instruments:
      harmony: {}
      drums: {genre: reggae}
      bass: {genre: reggae}
      rhythm_gtr: {genre: reggae}
      lead_gtr: {}
  chorus_rock:
    type: chorus
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  bridge_jazz:
    type: bridge
    bars: 8
    harmony: {progression: "iv7 bVII7 bIIImaj7 bVImaj7 iiø7 V7 i7 V7"}
    instruments:
      harmony: {}
      drums: {genre: jazz}
      bass: {genre: jazz}
      rhythm_gtr: {genre: jazz}
  solo_metal:
    type: solo
    bars: 8
    harmony: {progression: "i bVI bVII i"}
    instruments:
      harmony: {}
      drums: {genre: metal}
      bass: {genre: metal}
      rhythm_gtr: {genre: metal}
      lead_gtr: {genre: metal}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "i bVI bVII i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse_reggae, chorus_rock, verse_reggae, chorus_rock, bridge_jazz, solo_metal, chorus_rock, outro]
