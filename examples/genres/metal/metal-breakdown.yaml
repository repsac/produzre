# Metal Breakdown - Advanced Example
#
# Full modern metal arrangement with multiple breakdowns, bridge contrast,
# and extreme intensity. genre: metal drives all recipe parameters;
# metal persona provides tight, aggressive drums.
#
# Complexity: ADVANCED (full arrangement, multiple breakdowns)

version: 1

song:
  title: "Brutal Breakdown"
  bpm: 180
  key: C
  mode: minor
  meter: "4/4"
  genre: metal
  seed: 1500
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  drums:
    persona: "metal"
  bass:
    params:
      rhythm_pattern: "drive"
      articulation_style: "pick"
      lock_to_kick: 1.0

sections:
  intro:
    type: intro
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.9
      drums:
        intensity: 0.9
      bass:
        intensity: 0.9
      rhythm_gtr:
        intensity: 0.9

  verse_1:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 1.0
      bass:
        intensity: 1.0
      rhythm_gtr:
        intensity: 1.0

  pre_breakdown:
    type: prechorus
    bars: 4
    harmony:
      progression: ["VI", "VII", "i", "VII"]
    instruments:
      harmony:
        intensity: 1.05
      drums:
        intensity: 1.05
      bass:
        intensity: 1.05
      rhythm_gtr:
        intensity: 1.05

  breakdown_1:
    type: breakdown
    bars: 8
    harmony:
      progression: ["i", "VII", "VI", "VII"]
    instruments:
      harmony:
        intensity: 1.2
      drums:
        intensity: 1.2
      bass:
        intensity: 1.2
      rhythm_gtr:
        intensity: 1.2
        extra:
          sustain_mode: true
          sustain_duration: 0.5

  verse_2:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 1.05
      drums:
        intensity: 1.05
      bass:
        intensity: 1.05
      rhythm_gtr:
        intensity: 1.05

  bridge:
    type: bridge
    bars: 8
    harmony:
      progression: ["III", "VII", "VI", "VII"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 0.95
      bass:
        intensity: 0.95
        params:
          rhythm_pattern: "syncopated"
      rhythm_gtr:
        intensity: 1.0

  breakdown_2:
    type: breakdown
    bars: 8
    harmony:
      progression: ["i", "VI"]
    instruments:
      harmony:
        intensity: 1.3
      drums:
        intensity: 1.3
      bass:
        intensity: 1.3
      rhythm_gtr:
        intensity: 1.3

  outro:
    type: outro
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.9
      drums:
        intensity: 0.9
      bass:
        intensity: 0.9
      rhythm_gtr:
        intensity: 0.9
        extra:
          sustain_mode: true
          sustain_duration: 4.0

arrangement:
  - intro
  - verse_1
  - pre_breakdown
  - breakdown_1
  - verse_2
  - bridge
  - breakdown_2
  - verse_1
  - outro
