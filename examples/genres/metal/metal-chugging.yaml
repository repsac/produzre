# Metal Chugging - Intermediate Example
#
# Alternating riff and breakdown sections with genre: metal driving
# all recipe parameters. metal persona for tight, aggressive drums.
#
# Complexity: INTERMEDIATE (4 sections, chugging breakdowns)

version: 1

song:
  title: "Chugging Metal"
  bpm: 170
  key: D
  mode: minor
  meter: "4/4"
  genre: metal
  seed: 1400
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  drums:
    persona: "metal"
  bass:
    params:
      rhythm_pattern: "drive"
      articulation_style: "pick"
      lock_to_kick: 0.95

sections:
  intro:
    type: intro
    bars: 4
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.9
      drums:
        intensity: 0.9
      bass:
        intensity: 0.9
      rhythm_gtr:
        intensity: 0.9

  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 1.0
      bass:
        intensity: 1.0
      rhythm_gtr:
        intensity: 1.0

  breakdown:
    type: breakdown
    bars: 4
    harmony:
      progression: ["VI", "VII"]
    instruments:
      harmony:
        intensity: 1.1
      drums:
        intensity: 1.1
      bass:
        intensity: 1.1
      rhythm_gtr:
        intensity: 1.1

  outro:
    type: outro
    bars: 4
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.9
      drums:
        intensity: 0.9
      bass:
        intensity: 0.9
      rhythm_gtr:
        intensity: 0.9

arrangement:
  - intro
  - verse
  - breakdown
  - verse
  - breakdown
  - outro
