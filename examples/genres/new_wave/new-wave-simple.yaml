# New Wave - Simple Example
#
# Bright, synth-pop influenced new wave in D major at 130 BPM. Clean
# tones, angular rhythm, and upbeat energy.
#
# Complexity: SIMPLE (1 section, minimal configuration)

version: 1

song:
  title: "Neon Signs"
  bpm: 130
  key: D
  mode: major
  meter: "4/4"
  genre: new_wave
  seed: 800
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["I", "V", "vi", "IV"]
    instruments:
      harmony:
        intensity: 0.75
      drums:
        intensity: 0.75
      bass:
        intensity: 0.75
      rhythm_gtr:
        intensity: 0.7

arrangement:
  - verse
  - verse
