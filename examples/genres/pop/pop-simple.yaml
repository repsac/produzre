# Pop - Simple Example
#
# Catchy, clean pop with a classic I-V-vi-IV progression in C major.
# Bright and radio-friendly at 115 BPM.
#
# Complexity: SIMPLE (1 section, minimal configuration)

version: 1

song:
  title: "Sunshine Days"
  bpm: 115
  key: C
  mode: major
  meter: "4/4"
  genre: pop
  seed: 200
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["I", "V", "vi", "IV"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7

arrangement:
  - verse
  - verse
