    type: intro
    bars: 4
    harmony: {progression: "i i IV IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse:
    type: verse
    bars: 8
    harmony: {progression: "i bIII IV i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    meter: "4/4"
    harmony: {progression: "bVI bVII i i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  bridge:
    type: bridge
    bars: 4
    meter: "5/4"
    meter_grouping: "3+2"
    harmony: {progression: "bVII bVI bVII IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  solo:
    type: solo
    bars: 8
    meter_grouping: "3+2+2"
    harmony: {progression: "i IV i IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "i bVII IV i"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, chorus, verse, chorus, bridge, solo, chorus, outro]
