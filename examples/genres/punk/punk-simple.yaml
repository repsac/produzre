    type: verse
    bars: 8
    harmony:
      progression: ["I", "IV", "V", "IV"]
    instruments:
      harmony:
        intensity: 0.9
      drums:
        intensity: 0.9
      bass:
        intensity: 0.9
      rhythm_gtr:
        intensity: 0.9

arrangement:
  - verse
  - verse
