# Simple Reggae - Beginner Example
#
# genre: reggae activates offbeat skank drum patterns, upbeat-heavy
# rhythm guitar, and reggae harmony recipes.
#
# Complexity: SIMPLE (1 section, minimal configuration)

version: 1

song:
  title: "Island Groove"
  bpm: 80
  key: A
  mode: minor
  meter: "4/4"
  genre: reggae
  seed: 1700
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  groove:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "IV", "i", "IV"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7

arrangement:
  - groove
  - groove
