# Reggae: a roots song in G major with a one-drop drummer and a dub bass.
#
# The composer knows reggae. The drummer plays the one-drop in the intro,
# verses and bridge (kick and rim together on beat 3, beat 1 left empty)
# and switches to rockers in the choruses and outro (kick on 1 and 3), the
# rhythm guitar skanks (on 2 and 4 with a double chuck on the drop in the
# verses and bridge, on the "and" of every beat elsewhere), and groove
# memory locks every part into a riddim that returns with each section.
# The lead plays around a singer (foreground: auto): a hook in the intro,
# a lick at the end of each verse, a sparse counter-line under the chorus.
#
# Pinned, and why:
#   - bass persona dub: a round, deep line that sits behind the beat, two
#     long notes in most bars (each chord's root on the downbeat, another
#     chord tone on the drop), now and then the tonic held as a pedal
#   - arrangement_style.comp_activity: sparse, so the skank stays simple and
#     the bass carries the melody of the riddim
#   - arrangement_style.into_chorus: drop, the bass drops out and the skank
#     thins for the bar before each chorus, a classic reggae lift
# Everything else (the drummer's hand figure, fills, the lead's licks) is
# drawn from the shared produzre-examples project and the seed.
#
# Listen for:
#   - the one-drop in the verse: nothing on beat 1, kick and rim on 3
#   - the choruses lifting to rockers, the kick on 1 and 3
#   - the skank on 2 and 4 in the verse, then on every offbeat in the
#     chorus
#   - the dub bass: each chord's root on the downbeat and a second note on
#     the drop; in the later choruses the tonic G holds under the vi
#   - the I IV cycle of the verse against the IV V I vi of the chorus
#   - the bass dropping out for a bar before each chorus
version: 1
song:
  project: produzre-examples
  title: "Hillside Riddim"
  bpm: 74
  key: G
  mode: major
  meter: "4/4"
  genre: reggae
  seed: 3101
  turnarounds: true
  exports_root: "exports"
  arrangement_style:
    comp_activity: sparse
    into_chorus: drop

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  bass:
    persona: dub
  lead_gtr:
    params:
      foreground: auto
      register: [62, 79]

sections:
  intro:
    type: intro
    bars: 4
    harmony: {progression: "I IV I V"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse:
    type: verse
    bars: 8
    harmony: {progression: "I IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "IV V I vi"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  bridge:
    type: bridge
    bars: 8
    harmony: {progression: "vi V IV V"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "I IV I I"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, chorus, verse, chorus, bridge, chorus, outro]
