# Reggae: a roots song in G major with a one-drop drummer and a dub bass.
#
# The composer knows reggae. The drummer plays the one-drop (kick and rim
# together on beat 3, beat 1 left empty) with its own hand figure, the
# rhythm guitar skanks on the offbeats, and groove memory locks every part
# into a two-bar riddim that returns with each section. The lead plays
# around a singer (foreground: auto): a hook in the intro, licks at phrase
# ends, a counter-line under the chorus.
#
# Pinned, and why:
#   - bass persona dub: a round bass that sits behind the beat; density,
#     rest_rate and fifth_jump_rate are raised or lowered from the reggae
#     recipe so the line keeps a root on every downbeat and still leaves
#     holes around the drop
#   - arrangement_style.comp_activity: sparse, so the skank stays simple and
#     the bass carries the melody of the riddim
#   - arrangement_style.into_chorus: drop, the band thins out for a beat
#     before the chorus, a classic reggae lift
# Everything else (the drummer's hand figure, fills, the lead's licks) is
# drawn from the seed.
#
# Listen for:
#   - the one-drop: nothing on beat 1, kick and rim on 3
#   - offbeat skanks on the "and" of every beat, never on the beat
#   - a bass line with holes in it, sitting on the drop with the kick
#   - the I IV cycle of the verse against the IV V I vi of the chorus
#   - the chorus riddim returning note for note each time
version: 1
song:
  title: "Hillside Riddim"
  bpm: 74
  key: G
  mode: major
  meter: "4/4"
  genre: reggae
  seed: 3101
  turnarounds: true
  exports_root: "exports"
  arrangement_style:
    comp_activity: sparse
    into_chorus: drop

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

instruments:
  bass:
    persona: dub
    params: {density: 0.8, rest_rate: 0.12, pedal_rate: 0.1, fifth_jump_rate: 0.05}
  lead_gtr:
    params:
      foreground: auto
      register: [62, 79]

sections:
  intro:
    type: intro
    bars: 4
    harmony: {progression: "I IV I V"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse:
    type: verse
    bars: 8
    harmony: {progression: "I IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "IV V I vi"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  bridge:
    type: bridge
    bars: 8
    harmony: {progression: "vi V IV V"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "I IV I I"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, chorus, verse, chorus, bridge, chorus, outro]
