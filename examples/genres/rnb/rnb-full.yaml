# R&B Full Arrangement - Intermediate Example
#
# Lush R&B arrangement in Bb minor with extended harmonies,
# finger-style bass, and smooth dynamic contours. Builds from
# intimate verse to soaring chorus.
#
# Complexity: INTERMEDIATE (verse-chorus with bridge and dynamics)

version: 1

song:
  title: "Velvet Night"
  bpm: 95
  key: Bb
  mode: minor
  meter: "4/4"
  genre: rnb
  seed: 550
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  bass:
    params:
      articulation_style: "finger"

sections:
  intro:
    type: intro
    bars: 4
    harmony:
      progression: ["i7", "iv7"]
    instruments:
      harmony:
        intensity: 0.45
      drums:
        intensity: 0.4
      bass:
        intensity: 0.5
      rhythm_gtr:
        intensity: 0.4

  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["i7", "iv7", "VI", "V7"]
    instruments:
      harmony:
        intensity: 0.65
      drums:
        intensity: 0.6
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.6

  chorus:
    type: chorus
    bars: 8
    harmony:
      progression: ["VImaj7", "VII", "i7", "iv7", "VImaj7", "V7", "i7", "i7"]
    instruments:
      harmony:
        intensity: 0.85
      drums:
        intensity: 0.8
      bass:
        intensity: 0.85
      rhythm_gtr:
        intensity: 0.75

  bridge:
    type: bridge
    bars: 8
    harmony:
      progression: ["iv7", "VII", "III", "VImaj7", "iv7", "V7", "i7", "V7"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.55
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.55

  outro:
    type: outro
    bars: 4
    harmony:
      progression: ["iv7", "V7", "i7", "i7"]
    instruments:
      harmony:
        intensity: 0.45
      drums:
        intensity: 0.35
      bass:
        intensity: 0.45
      rhythm_gtr:
        intensity: 0.35

arrangement:
  - intro
  - verse
  - chorus
  - verse
  - chorus
  - bridge
  - chorus
  - outro
