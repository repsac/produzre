# Simple Rock - Beginner Example
#
# Demonstrates the genre recipe system: setting genre: rock auto-loads
# drum patterns, rhythm guitar style, and harmony recipes — no manual
# parameter tuning needed.
#
# Complexity: SIMPLE (1 section, minimal configuration)

version: 1

song:
  title: "Basic Rock"
  bpm: 120
  key: D
  mode: major
  meter: "4/4"
  genre: rock
  seed: 400
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["I", "IV", "V", "IV"]
    instruments:
      harmony:
        intensity: 0.8
      drums:
        intensity: 0.8
      bass:
        intensity: 0.8
      rhythm_gtr:
        intensity: 0.8

arrangement:
  - verse
  - verse
