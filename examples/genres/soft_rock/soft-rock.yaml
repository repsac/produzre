    bars: 8
    harmony: {progression: "I iii vi IV"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, lead_gtr: {}}
  prechorus:
    type: prechorus
    bars: 4
    harmony: {progression: "ii iii IV V"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "IV V I vi"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, rhythm_gtr: {}, lead_gtr: {}}
  bridge:
    type: bridge
    bars: 4
    harmony: {progression: "bVII IV I V"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, rhythm_gtr: {}}
  solo:
    type: solo
    bars: 8
    harmony: {progression: "IV V I vi"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, rhythm_gtr: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "IV V I I"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, prechorus, chorus, verse, prechorus, chorus, bridge, solo, chorus, outro]
