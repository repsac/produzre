# Techno: a hypnotic A minor track at 130 BPM built on a four-on-the-floor kit.
#
# The composer's dance drummer plays the kit: kick on every beat, a clap on
# 2 and 4, closed hats on the offbeats in the intro, sixteenth hats and a
# snare roll through the builds, and an open hat on every offbeat in the
# drops, the "boom tss" of techno. A synth bass rolls under a
# sixteenth-note synth ostinato (the arpeggiator), the chords move slowly
# (two bars each), and a synth lead (the lead guitar engine on a
# square-wave patch, foreground: full) states a short hook in the drops.
# The breakdown drops the drums and bass and leaves the ostinato and the
# lead; each build drops out for its last bar before the drop lands.
#
# Pinned, and why:
#   - bass lock_to_hat 1 with lock_to_kick 0 and a low density: a choice
#     for the rolling techno bass, which follows the hats: the offbeats
#     between the kicks in the intro and drops, running sixteenths in the
#     builds and outro; octave pops on, fifth jumps off, so it stays on
#     the chord tones
#   - arpeggiator pattern ostinato in sixteenths: a repeating four-note
#     cell per chord, the sequencer sound of the genre
#   - harmony chord_rate 8: one chord every two bars, so the track breathes
#   - engines: synth bass, sawtooth arpeggio, square-wave lead
# The drummer's hat patterns, the bass pitches and the lead hook come from
# the shared produzre-examples project and the seed.
#
# Listen for:
#   - the kick on every beat and the offbeat open hat in the drops
#   - the bass on the offbeats, answering each kick
#   - the sixteenth-note ostinato turning over each chord
#   - the breakdown without drums, then the build and the second drop
#   - the lead hook in the first drop, lifted higher in the last
version: 1
song:
  project: produzre-examples
  title: "Concrete Pulse"
  bpm: 130
  key: A
  mode: minor
  meter: "4/4"
  genre: techno
  seed: 9130
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid]
    subdiv: 16

engines:
  bass: {program: 38}          # GM Synth Bass 1
  arpeggiator: {program: 81}   # GM Lead 2 (sawtooth)
  lead_gtr: {program: 80}      # GM Lead 1 (square)

instruments:
  bass:
    params:
      lock_to_hat: 1.0
      lock_to_kick: 0
      density: 0.3
      rest_rate: 0.0
      octave_jump_rate: 0.3
      fifth_jump_rate: 0
  arpeggiator:
    params: {pattern: ostinato, note_duration: 0.25, octave_range: 2}
  lead_gtr:
    params:
      foreground: full
      register: [64, 84]

sections:
  intro:
    type: intro
    bars: 8
    harmony: {progression: "i", chord_rate: 8}
    instruments: {harmony: {}, drums: {}, bass: {}}
  build:
    type: prechorus
    bars: 8
    harmony: {progression: "i bVII", chord_rate: 8}
    instruments: {harmony: {}, drums: {}, bass: {}, arpeggiator: {}}
  drop:
    type: chorus
    bars: 16
    harmony: {progression: "i bVI bVII i", chord_rate: 8}
    instruments: {harmony: {}, drums: {}, bass: {}, arpeggiator: {}, lead_gtr: {}}
  breakdown:
    type: breakdown
    bars: 8
    harmony: {progression: "bVI bVII", chord_rate: 8}
    instruments: {harmony: {}, arpeggiator: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 8
    harmony: {progression: "i", chord_rate: 8}
    instruments: {harmony: {}, drums: {}, bass: {}}

arrangement: [intro, build, drop, breakdown, build, drop, outro]
