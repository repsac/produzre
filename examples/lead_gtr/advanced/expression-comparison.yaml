# Lead expression: the same composed line, played dry or wet.
#
# The composed lead carries technique hints (bends, slides, vibrato,
# staccato, a final dive) and the lead engine performs them as pitch bend
# and CC11 volume swells. Expression settings change the performance, not
# the notes. The three choruses play the same remembered hook line:
#
#   chorus_dry      bend_rate 0, vibrato_rate 0, swell_rate 0: no bends and
#                   no swells; vibrato only where the composer wrote it (the
#                   held cadence notes)
#   chorus          the defaults: this hook carries no composed bends, so
#                   none play; vibrato on most held notes and a volume swell
#                   on a few of them
#   chorus_wet      bend_rate 1, vibrato_rate 1, swell_rate 1: untagged
#                   notes of half a beat or longer bend in from below (above
#                   0.15, bend_rate adds bends), vibrato on every note held a
#                   beat or longer, a volume swell on every note held 1.5
#                   beats
#   solo            dive_rate 1: every note held 1.5 beats or longer ends in
#                   a whammy dive, and so does the solo's last note
#                   (`solo_ending: dive`, rock and metal only)
#   chorus_final    the defaults again, the hook lifted as a last chorus
#                   (most notes a third to a fourth higher)
#
# Pitch bend is per MIDI channel, so assign the lead its own channel in
# your DAW.
version: 1
song:
  project: produzre-examples
  title: "Lead Expression Comparison"
  bpm: 108
  key: E
  mode: minor
  meter: "4/4"
  genre: hard_rock
  seed: 5103
  arrangement_style: {solo_ending: dive}
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

instruments:
  lead_gtr:
    params: {foreground: full}

sections:
  chorus_dry:
    type: chorus
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {bend_rate: 0.0, vibrato_rate: 0.0, swell_rate: 0.0}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus_wet:
    type: chorus
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {bend_rate: 1.0, vibrato_rate: 1.0, swell_rate: 1.0}}
  solo:
    type: solo
    bars: 8
    harmony: {progression: "i bVII bVI bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {dive_rate: 1.0}}
  chorus_final:
    type: chorus
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [chorus_dry, chorus, chorus_wet, solo, chorus_final]
