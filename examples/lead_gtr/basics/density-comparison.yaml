# Lead Guitar - Density Comparison
#
# This example demonstrates how density and rest_probability affect lead guitar output.
# Three sections compare sparse, moderate, and dense lead guitar approaches.
#
# Key parameters tested:
# - rest_probability: Controls how much space/silence between notes (0.0 = no rests, 0.8 = lots of space)
# - intensity: Affects note density and velocity
# - phrase_len_bars: Length of repeated motifs
#
# Expected behavior:
# - Sparse: Minimal notes, lots of space (typical for verse backing)
# - Moderate: Balanced phrase with breathing room (typical for melodic lead)
# - Dense: Active lead line (typical for solo sections)

version: 1

song:
  title: "Lead Density Test"
  bpm: 100
  key: A
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 200
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  sparse_lead:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "III", "VII"]
    instruments:
      harmony:
        intensity: 0.6
      drums:
        intensity: 0.6
      bass:
        intensity: 0.6
      rhythm_gtr:
        intensity: 0.6
      lead_gtr:
        intensity: 0.5  # Lower intensity
        extra:
          rest_probability: 0.5  # Lots of space
          phrase_len_bars: 2
          contour_style: "balanced"

  moderate_lead:
    type: chorus
    bars: 8
    harmony:
      progression: ["i", "VI", "III", "VII"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7
      lead_gtr:
        intensity: 0.7  # Medium intensity
        extra:
          rest_probability: 0.25  # Moderate space
          phrase_len_bars: 2
          contour_style: "balanced"

  dense_lead:
    type: bridge
    bars: 8
    harmony:
      progression: ["i", "VI", "III", "VII"]
    instruments:
      harmony:
        intensity: 0.8
      drums:
        intensity: 0.8
      bass:
        intensity: 0.8
      rhythm_gtr:
        intensity: 0.8
      lead_gtr:
        intensity: 0.9  # High intensity
        solo: true      # Enable solo mode for higher density
        extra:
          rest_probability: 0.1   # Minimal space
          phrase_len_bars: 2
          contour_style: "balanced"

arrangement:
  - sparse_lead
  - moderate_lead
  - dense_lead

# Analysis targets:
# 1. Count notes per bar in each section
# 2. Verify sparse section has ~1-2 notes per bar
# 3. Verify moderate section has ~3-5 notes per bar
# 4. Verify dense section has ~5-8 notes per bar
