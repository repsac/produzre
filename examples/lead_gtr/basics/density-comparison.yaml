# Lead density: `rest_probability` gives the composed lead more space.
#
# The lead is composed from the song's DNA: a hook, a verse idea and a bank
# of signature licks. `rest_probability` drops phrase items that are not
# structural (answers, developments, fills) on a seeded stream. The hook,
# cadences and the solo's big moments always stay.
#
#   verse           unset: the composer's full verse period, a phrase in
#                   every bar
#   verse_space     0.5:  three of the eight bars (the half cadence, the
#                   next phrase and the final cadence), same melody
#   verse_sparse    0.85: only the two cadence bars (bars 4 and 8)
#   chorus_sparse   0.85: the answers (bars 2 and 6) go, but every hook
#                   statement stays, so the chorus still sings its hook
#
# The three verses play the same remembered verse melody, so you hear the
# same line with more air. From the second verse on, the composer also
# changes a few rhythms (a verse's "new lyrics"). The lead is the
# instrumental melody here (`foreground: full`).
version: 1
song:
  project: produzre-examples
  title: "Lead Rest Comparison"
  bpm: 100
  key: A
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 5101
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

instruments:
  lead_gtr:
    params: {foreground: full}

sections:
  verse:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  verse_space:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {rest_probability: 0.5}}
  verse_sparse:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {rest_probability: 0.85}}
  chorus_sparse:
    type: chorus
    bars: 8
    harmony: {progression: "bVI bVII i i"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {rest_probability: 0.85}}

arrangement: [verse, verse_space, verse_sparse, chorus_sparse]
