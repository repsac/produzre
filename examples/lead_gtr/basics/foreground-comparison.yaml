    harmony: {progression: "I V vi IV"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {foreground: auto}}
  chorus_singer:
    type: chorus
    bars: 8
    harmony: {progression: "IV V I vi"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {params: {foreground: auto}}

arrangement: [verse_melody, chorus_melody, verse_singer, chorus_singer]
