# Lead Guitar - Resolution Strength Comparison
#
# This example demonstrates how resolution_strength affects harmonic alignment:
# - Low resolution (0.2): Lead stays more independent, uses passing tones
# - Medium resolution (0.5): Balanced mix of chord tones and color notes
# - High resolution (0.8): Strong pull to chord tones, very harmonic
#
# Resolution strength controls how often lead notes are chord tones vs. scale neighbors.
# Higher values create more consonant, "inside" playing.
# Lower values allow more tension and color tones.

version: 1

song:
  title: "Resolution Test"
  bpm: 100
  key: A
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 700
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  low_resolution:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "iv", "bVI", "V"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7
      lead_gtr:
        intensity: 0.7
        solo: true
        extra:
          rest_probability: 0.2
          phrase_len_bars: 2
          contour_style: "balanced"
          resolution_strength: 0.2  # Low - more passing tones, tension

  medium_resolution:
    type: chorus
    bars: 8
    harmony:
      progression: ["i", "iv", "bVI", "V"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7
      lead_gtr:
        intensity: 0.7
        solo: true
        extra:
          rest_probability: 0.2
          phrase_len_bars: 2
          contour_style: "balanced"
          resolution_strength: 0.5  # Medium - balanced approach

  high_resolution:
    type: bridge
    bars: 8
    harmony:
      progression: ["i", "iv", "bVI", "V"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7
      lead_gtr:
        intensity: 0.7
        solo: true
        extra:
          rest_probability: 0.2
          phrase_len_bars: 2
          contour_style: "balanced"
          resolution_strength: 0.8  # High - strong chord tone emphasis

arrangement:
  - low_resolution
  - medium_resolution
  - high_resolution

# Analysis targets:
# 1. Count percentage of notes that are chord tones in each section
# 2. Verify low_resolution has more non-chord tones
# 3. Verify high_resolution predominantly uses chord tones
# 4. Listen for "inside" vs "outside" harmonic feel
# 5. Check if phrase endings resolve to chord tones more in high_resolution
