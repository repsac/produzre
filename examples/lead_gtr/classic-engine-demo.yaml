# classic-engine demo
#
# The classic lead generator (the 0.9 motif engine), kept for the knobs the
# composer does not use. `composer: false` in the lead params selects it
# for every section, and these settings work again:
#
#   phrase_len_bars       motif length; later phrases develop the opening motif
#   resolution_strength   how strongly phrase endings land on chord tones
#   theme_quote_rate      how often interior notes quote the melody theme
#   ring_out              how far notes ring into the following silence
#   contour_style         stepwise, balanced or leaping motion
#
#   one_bar_phrases    phrase_len_bars 1, weak resolution, stepwise
#   two_bar_phrases    phrase_len_bars 2, medium resolution, balanced
#   four_bar_phrases   phrase_len_bars 4, strong resolution, leaping, short notes
#
# Unlike the composer, this engine draws a fresh motif per section and does
# not remember sections, so a returning chorus is not repeated note for note.
# Everything else in the band stays composed.
version: 1
song:
  title: "Classic Lead Engine"
  bpm: 100
  key: A
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 5104
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

instruments:
  lead_gtr:
    params: {composer: false, foreground: full, theme_quote_rate: 0.8}

sections:
  one_bar_phrases:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr:
        params: {phrase_len_bars: 1, resolution_strength: 0.2, contour_style: stepwise,
                 rest_probability: 0.25}
  two_bar_phrases:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr:
        params: {phrase_len_bars: 2, resolution_strength: 0.5, contour_style: balanced,
                 rest_probability: 0.25}
  four_bar_phrases:
    type: chorus
    bars: 8
    harmony: {progression: "bVI bVII i i"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr:
        params: {phrase_len_bars: 4, resolution_strength: 0.8, contour_style: leaping,
                 rest_probability: 0.15, ring_out: 0.2}

arrangement: [one_bar_phrases, two_bar_phrases, four_bar_phrases]
