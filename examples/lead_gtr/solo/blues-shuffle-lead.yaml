# Blues shuffle lead: an unaccompanied electric blues in A, a 12-bar verse,
# an 8-bar refrain and a 12-bar solo chorus, all played by one lead guitar.
#
# A lone lead defaults to foreground: full, so the composer carries the
# tune: a hook for the refrain, a verse idea, and three signature licks
# drawn from the blues vocabulary. The groove block swings the eighths
# (the lead has no drummer to take a feel from). Settings used all shape
# the composed line: a leaping contour, frequent bend-ins (bend_rate),
# wide vibrato, whammy dives in the solos (dive_rate), and the song's solo
# story pinned to a climb that ends in a dive (arrangement_style).
#
# Listen for:
#   - intro: the refrain's hook over a V-IV-I turnaround
#   - verse: a 12-bar blues melody that states, repeats over IV and
#     answers over V, with bends into the target notes
#   - refrain (chorus): the hook and its answer, higher and louder; every
#     refrain returns note for note
#   - the 12-bar solo tells a story: a hook quote, a climb up the neck
#     through the signature licks with bends, a climax around B5 and a
#     whammy dive to finish
#   - the last refrain comes back an octave higher
#   - the outro quotes the hook and holds the tonic
version: 1
song:
  title: "Solo Lead Blues Shuffle"
  bpm: 92
  key: A
  mode: mixolydian
  meter: "4/4"
  genre: blues
  seed: 9202
  arrangement_style:
    solo_story: climb
    solo_ending: dive
    lead_fills: chatty
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

groove:
  swing: 0.62

instruments:
  lead_gtr:
    persona: bluesy
    params:
      register: [52, 84]
      contour_style: leaping
      rest_probability: 0.25
      bend_rate: 0.45
      vibrato_rate: 0.75
      dive_rate: 0.4
      swell_rate: 0.0

sections:
  intro:
    type: intro
    bars: 4
    intensity: 0.6
    harmony: {progression: "V7 IV7 I7 V7"}
    instruments: {harmony: {}, lead_gtr: {}}
  verse:
    type: verse
    bars: 12
    harmony: {progression: "I7 IV7 I7 I7 IV7 IV7 I7 I7 V7 IV7 I7 V7"}
    instruments: {harmony: {}, lead_gtr: {}}
  refrain:
    type: chorus
    bars: 8
    harmony: {progression: "IV7 IV7 I7 I7 V7 IV7 I7 V7"}
    instruments: {harmony: {}, lead_gtr: {}}
  solo:
    type: solo
    bars: 12
    harmony: {progression: "I7 IV7 I7 I7 IV7 IV7 I7 I7 V7 IV7 I7 V7"}
    instruments: {harmony: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "IV7 I7 V7 I7"}
    instruments: {harmony: {}, lead_gtr: {}}

arrangement: [intro, verse, refrain, verse, refrain, solo, refrain, outro]
