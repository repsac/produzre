# Blues Lead Guitar
#
# Blues-style lead guitar with 12-bar form.
# Stepwise pentatonic phrases with breathing room,
# building to a denser solo section.
#
# genre: blues loads shuffle drums and laid-back rhythm guitar.

version: 1

song:
  title: "Blues Lead"
  bpm: 85
  key: E
  mode: major
  meter: "4/4"
  genre: blues
  seed: 300
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  drums:
    persona: "jazz-lite"
  bass:
    params:
      articulation_style: "finger"

sections:
  blues_verse:
    type: verse
    bars: 12
    harmony:
      progression: ["I", "I", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "I"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7
      lead_gtr:
        intensity: 0.7
        extra:
          rest_probability: 0.35
          phrase_len_bars: 4
          contour_style: "stepwise"
          resolution_strength: 0.5

  blues_solo:
    type: solo
    bars: 12
    harmony:
      progression: ["I", "I", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "I"]
    instruments:
      harmony:
        intensity: 0.8
      drums:
        intensity: 0.8
      bass:
        intensity: 0.8
      rhythm_gtr:
        intensity: 0.6
      lead_gtr:
        intensity: 0.85
        solo: true
        extra:
          rest_probability: 0.2
          phrase_len_bars: 4
          contour_style: "balanced"
          resolution_strength: 0.6

arrangement:
  - blues_verse
  - blues_solo
