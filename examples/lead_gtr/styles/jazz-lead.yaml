# Jazz lead: head, a melodic solo, head.
#
# The lead is the melody (`foreground: full`) over ii-V-I changes. The
# jazz drummer swings on the ride with feathered kicks and its own snare
# comping, and the bass keeps its own engine line.
# `arrangement_style` and the lead params set a singing solo:
#
#   solo_story: melodic   the solo sings the hook, answers it, lifts it and
#                         holds a summit before it resolves
#   solo_ending: trill    a quick trill into a held last note
#   bend_rate: 0          no bends: a clean jazz tone
#   contour_style         stepwise: leaps cost more, so lines move by step
#
# Listen for the head returning after the solo, lifted and ornamented as
# the song's last chorus.
version: 1
song:
  title: "Jazz Head and Solo"
  bpm: 144
  key: F
  mode: major
  meter: "4/4"
  genre: jazz
  seed: 5202
  arrangement_style: {solo_story: melodic, solo_ending: trill}
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

instruments:
  lead_gtr:
    params: {foreground: full, bend_rate: 0.0, contour_style: stepwise}

sections:
  head:
    type: chorus
    bars: 8
    harmony: {progression: ["ii7", "V7", "Imaj7", "vi7", "ii7", "V7", "Imaj7", "Imaj7"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  solo:
    type: solo
    bars: 16
    harmony:
      progression: ["ii7", "V7", "Imaj7", "vi7", "ii7", "V7", "Imaj7", "Imaj7",
                    "iii7", "vi7", "ii7", "V7", "ii7", "V7", "Imaj7", "Imaj7"]
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [head, solo, head]
