# Rock solo: a band with a singer, and a solo that climbs.
#
# The lead plays around a singer (`foreground: auto`, the default): licks
# at verse phrase ends, octave stabs under the chorus, then a featured
# solo. No vocal part is written; the space is left for one.
# `arrangement_style` pins the lead's habits:
#
#   counter: octaves       under the sung chorus, octave stabs on the changes
#   lead_fills: sparse     verse licks every eight bars
#   solo_story: climb      hook quote, development up the neck, a climax lick
#                          and bend, a resolving phrase
#   solo_ending: slide_off the last note falls away
#
# The solo uses `register: full`, so it can climb well past the chorus
# register. Listen for the second chorus repeating the first note
# for note, and the final chorus lifting after the solo.
version: 1
song:
  project: produzre-examples
  title: "Rock Solo Climb"
  bpm: 138
  key: D
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 5203
  arrangement_style: {counter: octaves, lead_fills: sparse, solo_story: climb, solo_ending: slide_off}
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony: {progression: ["i", "bVII", "bVI", "V7"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: ["bVI", "bVII", "i", "i"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  guitar_solo:
    type: solo
    bars: 16
    harmony: {progression: ["i", "bVII", "bVI", "V7"]}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}
      lead_gtr: {register: full}

arrangement: [verse, chorus, verse, chorus, guitar_solo, chorus]
