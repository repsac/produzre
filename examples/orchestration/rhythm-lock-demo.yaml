# Rhythm lock: how drums, bass and rhythm guitar lock together.
#
# The composed band is built to lock. The drummer is composed first and
# publishes its hits. The rhythm guitar's signature riff is scored against
# the drummer's kick and snare (accents in unison with them win, and no
# accent lands a sixteenth off the backbeat), and a riff-driven song's bass
# doubles that riff. Each section below shows one way the parts line up:
#
#   verse           the composed band: the signature riff over the drummer,
#                   the bass doubling its rhythm, mostly an octave down,
#                   and playing the riff's tail alone every other bar
#                   (`riff_driven`, `bass_doubles` pinned in
#                   `arrangement_style`)
#   prechorus       rhythm guitar `follow_hats: true`: the classic follow-
#                   the-hats renderer strums on the drummer's hat hits;
#                   `hat_density: 0.9` pins sixteenth hats here
#   chorus          bass `lock_to_kick: 0.9`: the bass engine line adds
#                   notes so that every kick of the drummer's busier
#                   chorus pattern has a bass note on it
#   verse (again)   the verse groove comes back, and the song ends on it
#
# `into_chorus: fill` is pinned too, so the drums fill the last prechorus
# bar (the bass joins the fill) while the follow-the-hats guitar keeps
# strumming.
#
# Check it: compare the kick (pitch 36) onsets in analysis/drums with the
# bass and rhythm guitar onsets in their events TSVs.
version: 1
song:
  project: produzre-examples
  title: "Rhythm Lock Demo"
  bpm: 120
  key: E
  mode: minor
  meter: "4/4"
  genre: hard_rock
  seed: 7101
  arrangement_style: {riff_driven: true, bass_doubles: true, into_chorus: fill}
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  prechorus:
    type: prechorus
    bars: 4
    harmony: {progression: "bVI bVII bVI bVII"}
    instruments:
      harmony: {}
      drums: {params: {hat_density: 0.9}}
      bass: {}
      rhythm_gtr: {params: {follow_hats: true}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "i bVI bIII bVII"}
    instruments:
      harmony: {}
      drums: {}
      bass: {params: {lock_to_kick: 0.9}}
      rhythm_gtr: {}

arrangement: [verse, prechorus, chorus, verse]
