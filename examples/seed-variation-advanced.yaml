# Seed control, advanced: A/B a new bridge and a new solo backing while
# the rest of the song stays put.
#
# Scenario: a producer likes the song but wants to
#   1. try a completely different bridge: the bridge section gets `seed: 555`,
#      a new drummer and new guitar figures for those eight bars only
#   2. keep the choruses: the composer remembers a section type, so the
#      second chorus repeats the first, and the last chorus (after the solo)
#      lifts it, whatever the seeds elsewhere
#   3. re-roll only the rhythm guitar under the solo: its `seed: 42`
#      draws new figures while the drums and bass keep theirs
#
# The composed lead is written from the song seed, so a lead `seed` changes
# only its humanization. To try another solo, pin a different
# `arrangement_style.solo_story` (climb, melodic, trade, blues) instead.
version: 1

song:
  title: "A/B Comparison"
  bpm: 130
  key: A
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 8102
  arrangement_style: {solo_story: climb}
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

instruments:
  drums:
    persona: rock
  bass:
    params: {articulation_style: pick}

sections:
  intro:
    type: intro
    bars: 4
    harmony: {progression: ["i", "VII"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}

  verse:
    type: verse
    bars: 8
    harmony: {progression: ["i", "VI", "VII", "i"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}

  chorus:
    type: chorus
    bars: 8
    harmony: {progression: ["VI", "VII", "i", "VII"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

  bridge:
    type: bridge
    bars: 8
    seed: 555                # a completely different bridge
    harmony: {progression: ["III", "VII", "VI", "VII"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}

  solo:
    type: solo
    bars: 8
    harmony: {progression: ["i", "VI", "VII", "i"]}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {seed: 42}  # new figures under the solo only
      lead_gtr: {}

  outro:
    type: outro
    bars: 4
    harmony: {progression: ["i", "VII", "i"]}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}

arrangement: [intro, verse, chorus, verse, chorus, bridge, solo, chorus, outro]
