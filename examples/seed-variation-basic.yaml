# Seed control, basic: re-roll one section, or one part of it.
#
#   song.seed        the whole song's material and performance
#   section seed     re-rolls that section: here the chorus gets its own
#                    drummer and rhythm guitar figures
#   instrument seed  re-rolls one part in one section: here the chorus drums
#                    get `seed: 777`, which wins over the section's seed, so
#                    the chorus drummer is re-rolled again while its guitar
#                    keeps the section seed's figures
#
# Use case: you love the song but want different chorus drums. Give the
# chorus drums a seed and rebuild: only the chorus drums change, apart from
# the bass, which follows the new drummer's accents (and its turnaround into
# the second verse) in the first chorus.
# For a new performance of the same parts, set `song.take` instead.
# The seed-variation/ folder compares each change against a base song.
version: 1

song:
  project: produzre-examples
  title: "Seed Variation Demo"
  bpm: 120
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 8101
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events, grid, tab]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony: {progression: ["i", "VI", "VII", "i"]}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}

  chorus:
    type: chorus
    bars: 8
    seed: 999                # the chorus plays its own figures
    harmony: {progression: ["VI", "VII", "i", "VII"]}
    instruments:
      harmony: {}
      drums: {seed: 777}     # and its own drummer
      bass: {}
      rhythm_gtr: {}

  outro:
    type: outro
    bars: 4
    harmony: {progression: ["i", "VI", "VII", "i"]}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      rhythm_gtr: {}

arrangement: [verse, chorus, verse, chorus, outro]
