# Seed & Variation - Basic Example
#
# Demonstrates granular seed and variation control:
# - song.seed: global seed for reproducibility
# - song.variation: global variation bias (0.0 = stable, 1.0 = max variation)
# - section.seed: override the song seed for one section only
# - section.variation: override song variation for one section
# - instrument.seed: re-roll a single instrument in a single section
# - instrument.variation: per-instrument variation override
#
# Use case: You love the song but want to re-roll just the chorus drums.
# Set a different seed on the chorus drums instrument to get a new pattern
# while everything else stays the same.
#
# Complexity: BASIC (demonstrates seed/variation at all levels)

version: 1

song:
  title: "Seed Variation Demo"
  bpm: 120
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 42
  variation: 0.0          # Global variation (0 = deterministic baseline)
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7

  chorus:
    type: chorus
    bars: 8
    seed: 999                # Re-roll THIS section with a different seed
    harmony:
      progression: ["VI", "VII", "i", "VII"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 1.0
        seed: 777            # Re-roll ONLY the drums in this section
      bass:
        intensity: 1.0
      rhythm_gtr:
        intensity: 1.0

  outro:
    type: outro
    bars: 4
    variation: 0.5           # Add variation to the outro only
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.5
      drums:
        intensity: 0.5
      bass:
        intensity: 0.5
        variation: 0.8       # Even more variation on the bass outro
      rhythm_gtr:
        intensity: 0.4

arrangement:
  - verse
  - chorus
  - verse
  - chorus
  - outro
