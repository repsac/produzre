# Seed & Variation — Base Song (Source)
#
# This is the baseline song. The 4 sibling files in this folder are
# identical copies with ONE change each, so you can A/B compare builds:
#
#   base-song.yaml              ← you are here (unchanged baseline)
#   section-seed-override.yaml  ← chorus has a different seed
#   section-variation.yaml      ← chorus has variation: 0.6
#   instrument-seed-override.yaml ← drums in chorus has a different seed
#   instrument-variation.yaml   ← drums in chorus has variation: 0.8
#
# Build all 5 and compare the MIDI output to see how granular
# seed/variation control affects individual sections and instruments.

version: 1

song:
  title: "Seed Variation Base"
  bpm: 120
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 42
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  intro:
    type: intro
    bars: 4
    harmony:
      progression: ["i", "VII"]
    instruments:
      harmony:
        intensity: 0.5
      drums:
        intensity: 0.5
      bass:
        intensity: 0.5
      rhythm_gtr:
        intensity: 0.4

  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7

  chorus:
    type: chorus
    bars: 8
    harmony:
      progression: ["VI", "VII", "i", "VII"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 1.0
      bass:
        intensity: 1.0
      rhythm_gtr:
        intensity: 1.0

  outro:
    type: outro
    bars: 4
    harmony:
      progression: ["i", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.4
      drums:
        intensity: 0.4
      bass:
        intensity: 0.4
      rhythm_gtr:
        intensity: 0.3

arrangement:
  - intro
  - verse
  - chorus
  - verse
  - chorus
  - outro
