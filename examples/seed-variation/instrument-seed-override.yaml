# Seed variation: an instrument seed override.
#
# Identical to base-song.yaml except that the chorus drums have
# `seed: 777`: a different drummer in the chorus only. The bass and rhythm
# guitar keep their notes (the chorus bass changes only its velocities,
# which follow the new drummer's accents), and every other section is
# unchanged.
version: 1

song:
  project: produzre-examples
  title: "Seed Variation Drum Seed"
  bpm: 120
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 42
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  intro:
    type: intro
    bars: 4
    harmony:
      progression: ["i", "VII"]
    instruments:
      harmony:
        intensity: 0.5
      drums:
        intensity: 0.5
      bass:
        intensity: 0.5
      rhythm_gtr:
        intensity: 0.4

  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7

  chorus:
    type: chorus
    bars: 8
    harmony:
      progression: ["VI", "VII", "i", "VII"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 1.0
        seed: 777
      bass:
        intensity: 1.0
      rhythm_gtr:
        intensity: 1.0

  outro:
    type: outro
    bars: 4
    harmony:
      progression: ["i", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.4
      drums:
        intensity: 0.4
      bass:
        intensity: 0.4
      rhythm_gtr:
        intensity: 0.3

arrangement:
  - intro
  - verse
  - chorus
  - verse
  - chorus
  - outro
