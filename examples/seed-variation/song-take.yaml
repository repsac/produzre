# Seed variation: a new take.
#
# Identical to base-song.yaml except for `take: 1`. A take keeps the song's
# themes and draws another performance. Here the drummer keeps its hit
# positions and pitches with new velocities. Rhythm guitar changes touch,
# strum timing, note lengths and a few chord tones. The bass changes notes
# in the intro and choruses while the verse and outro lines stay.
# Compare with `seed` overrides, which re-roll the players themselves.
version: 1

song:
  project: produzre-examples
  title: "Seed Variation Take"
  bpm: 120
  key: E
  mode: minor
  meter: "4/4"
  genre: rock
  seed: 42
  take: 1
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

sections:
  intro:
    type: intro
    bars: 4
    harmony:
      progression: ["i", "VII"]
    instruments:
      harmony:
        intensity: 0.5
      drums:
        intensity: 0.5
      bass:
        intensity: 0.5
      rhythm_gtr:
        intensity: 0.4

  verse:
    type: verse
    bars: 8
    harmony:
      progression: ["i", "VI", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.7
      drums:
        intensity: 0.7
      bass:
        intensity: 0.7
      rhythm_gtr:
        intensity: 0.7

  chorus:
    type: chorus
    bars: 8
    harmony:
      progression: ["VI", "VII", "i", "VII"]
    instruments:
      harmony:
        intensity: 1.0
      drums:
        intensity: 1.0
      bass:
        intensity: 1.0
      rhythm_gtr:
        intensity: 1.0

  outro:
    type: outro
    bars: 4
    harmony:
      progression: ["i", "VII", "i"]
    instruments:
      harmony:
        intensity: 0.4
      drums:
        intensity: 0.4
      bass:
        intensity: 0.4
      rhythm_gtr:
        intensity: 0.3

arrangement:
  - intro
  - verse
  - chorus
  - verse
  - chorus
  - outro
