    bars: 4
    harmony: {progression: "i7 IV7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}}
  verse:
    type: verse
    bars: 8
    harmony: {progression: "i7 IV7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  chorus:
    type: chorus
    bars: 8
    harmony: {progression: "bIII7 IV7 i7 i7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  breakdown:
    type: breakdown
    bars: 4
    harmony: {progression: "i7 IV7"}
    instruments: {harmony: {}, drums: {}, bass: {}}
  solo:
    type: solo
    bars: 8
    harmony: {progression: "i7 IV7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}
  outro:
    type: outro
    bars: 4
    harmony: {progression: "i7 IV7"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {}}

arrangement: [intro, verse, chorus, verse, chorus, breakdown, solo, chorus, outro]
