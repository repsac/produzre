# Clockwork Tide: an odd-meter prog rock instrumental in 7/8 and 5/4.
#
# The verses and choruses are in 7/8, grouped 2+2+3 (long last beat), so
# the riff limps forward and the melody breathes in the same groups. The
# chorus regroups the same meter as 3+2+2 (long first beat) for a lift
# without changing tempo. The bridge changes meter to 5/4 (3+2), and the
# solo returns to 7/8. The lead guitar carries the melody (foreground:
# full), and the rhythm guitar and bass are built on one signature riff.
#
# Pins: riff_driven and bass_doubles, so the verses, intro and outro ride
# a signature riff with the bass in unison an octave down (the prog
# signature). The band drawn for the shared produzre-examples project
# chose the rest: a climbing solo, the band dropping out for the bar before
# each chorus, and sparse comping that answers itself every fourth bar.
#
# Listen for:
#   - count the verse bars: 1-2, 1-2, 1-2-3
#   - the chorus feeling different in the same 7/8: 1-2-3, 1-2, 1-2
#   - the bridge opening up into 5/4, then the solo snapping back to 7/8
#   - the melody phrasing in the meter's groups instead of fighting them
