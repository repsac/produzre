# Cold Coffee Blues: a slow 12/8 blues, late at night.
#
# Twelve-bar blues in G, felt in four slow dotted-quarter beats per bar
# with three eighth notes in each. The singer (not rendered) takes the
# verses; the lead guitar answers each vocal line with a lick (foreground:
# auto) and then takes two choruses of solo. A piano (the arpeggiator)
# rolls the triplets, the rhythm guitar plays a signature riff under the
# verses and strums through the solo, and the composed drummer plays on the
# 12/8 pulse: snare on pulses 2 and 4, ride eighths in the intro, a busier
# closed hi-hat in the verses and hi-hat eighths with an open hat in the
# solo. Nothing is swung: 12/8 is already in threes.
#
# Pins and choices made on purpose:
#   - arrangement_style intro: riff_alone, so the riff opens the song
#     alone and the drums, bass, piano and lead wait out the first half of
#     the intro
#   - the bass plays an authored twelve-bar line (a bass_motif theme):
#     root, third, fifth, sixth or flat seventh, back down, on each chord.
#     The motif owns the bass rhythm and lengths; the intro and outro turn
#     quoting off (motif_quote_rate 0) because the line is written for 12
#     bars, so the bass plays held roots there
#   - the lead uses the bluesy persona for its phrasing and bends
# The quick-change form (IV7 in bar 2) and the V7 turnaround in bar 12 are
# written into the progression.
#
# Listen for:
#   - the intro: the riff alone, then drums, bass and piano halfway through
#   - four big beats per bar, each split in three (12/8, not 4/4 swing)
#   - the bass line climbing and falling through each chord
#   - licks answering the vocal lines at the end of each four bars
#   - the turnaround on V7 pulling each chorus back to the top
#   - the second solo chorus developing the first (varied, not repeated)
#     over a louder band, then a quieter last verse without rhythm guitar
