    bars: 4
    harmony: {progression: "IV I V I"}
    instruments:
      harmony: {}
      acoustic_gtr: {params: {picking_pattern: travis}}

arrangement: [intro, verse_alone, verse_bass, chorus_first, verse_band, chorus, bridge, verse_quiet, chorus, outro]
