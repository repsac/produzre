    bars: 8
    harmony: {progression: "IV I V vi IV I V I"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, lead_gtr: {}}
  bridge:
    type: bridge
    bars: 8
    harmony: {progression: "vi IV I V vi IV V V"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}, lead_gtr: {}}
  verse_quiet:
