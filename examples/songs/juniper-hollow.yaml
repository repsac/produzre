    bars: 8
    harmony: {progression: "I IV I V I IV V I"}
    instruments:
      harmony: {}
      acoustic_gtr: {params: {picking_pattern: travis}}
  verse_bass:
    type: verse
    bars: 8
    harmony: {progression: "I IV I V I IV V I"}
    instruments:
      harmony: {}
      bass: {}
      acoustic_gtr: {params: {picking_pattern: travis}}
  chorus_first:
    type: chorus
    bars: 8
    harmony: {progression: "IV I V vi IV I V I"}
    instruments: {harmony: {}, drums: {}, bass: {}, acoustic_gtr: {}}
  verse_band:
    type: verse
    bars: 8
    harmony: {progression: "I IV I V I IV V I"}
    instruments:
      harmony: {}
      drums: {}
      bass: {}
      acoustic_gtr: {params: {picking_pattern: travis}}
      lead_gtr: {}
  chorus:
