    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, acoustic_gtr: {}, lead_gtr: {}}
  solo:
    type: solo
    bars: 16
    harmony: {progression: "I I IV IV I I V V I I IV IV I V I I"}
    instruments: {harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, acoustic_gtr: {}, lead_gtr: {}}
  outro:
