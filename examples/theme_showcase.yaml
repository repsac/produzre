version: 1
song:
  title: "ThemeShowcase"
  bpm: 122
  key: E
  mode: ionian
  meter: "4/4"
  genre: rock
  seed: 11
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: [events]
    subdiv: 16

# ---------------------------------------------------------------------------
# Theme showcase: every role, every drum voice, one drums-only breakdown.
#
#   main_riff    - locked (allow_development: false): quoted verbatim in
#                  every section, all arc treatments bypassed.
#   chorus_hook  - develops: intro/verse treatments apply, and the second
#                  chorus statement lifts the hook an octave.
#   bass_hook    - bass quotes its pitches and locks to its onsets.
#   kit_groove   - 2-bar kit pattern using all seven drum voices:
#                  signature double kick on the "e of 3", an open hat at the
#                  end of bar 1, an off-beat crash and a bar-end tom in bar 2.
#                  Locked: arc inversion would swap voices nonsensically.
#
# Degrees are key-relative (E major): 1=E 2=F# 3=G# 4=A 5=B 6=C# 7=D#.
# Drum degrees: 1 kick, 2 snare, 3 hat, 4 open hat, 5 crash, 6 ride, 7 tom.
# ---------------------------------------------------------------------------
themes:
  main_riff:
    role: riff
    register: [40, 55]          # E2..G3
    allow_development: false
    events: "1:.5 .:.25 1:.25 b3:.5 4:.5 b5:.25 4:.25 5:1.5"

  chorus_hook:
    role: melody
    register: [64, 79]          # E4..G5
    events: "5:.5 5:.5 6:.5 5:.5 4:1 b3:.5 2:.5 1:4"

  bass_hook:
    role: bass_motif
    register: [36, 52]          # C2..E3
    events: "1:1 1:.5 b3:.5 4:1 5:1"

  kit_groove:
    role: drum_groove
    allow_development: false
    # bar 1: kick, hat, snare, hat, double kick, hat, snare, OPEN hat
    # bar 2: kick, hat, snare, hat, kick + off-beat CRASH, snare, TOM pickup
    events: "1:.5 3:.5 2:.5 3:.5 1:.25 1:.25 3:.5 2:.5 4:.5 1:.5 3:.5 2:.5 3:.5 1:.5 5:.5 2:.5 7:.5"

sections:
  intro:
    type: intro
    bars: 4
    harmony: { progression: "I I I I" }
    instruments: { harmony: {}, drums: {}, bass: {} }
  verse:
    type: verse
    bars: 8
    harmony: { progression: "I bVII IV I" }
    instruments: { harmony: {}, drums: {}, bass: {}, rhythm_gtr: {} }
  chorus:
    type: chorus
    bars: 8
    harmony: { progression: "bVI bVII I I" }
    instruments: { harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {} }
  breakdown:
    type: breakdown
    bars: 4
    # No harmony block, drums only: the signature groove still plays --
    # the rock recipe moves the line to ride here (open-hat onsets degrade
    # to ride hits), while the crash and tom accents punch through.
    instruments: { drums: {} }
  chorus2:
    type: chorus
    bars: 8
    harmony: { progression: "bVI bVII I I" }
    instruments: { harmony: {}, drums: {}, bass: {}, rhythm_gtr: {}, lead_gtr: {} }
  outro:
    type: outro
    bars: 4
    harmony: { progression: "I I I I" }
    instruments: { harmony: {}, bass: {}, drums: {} }

arrangement:
  - intro
  - verse
  - chorus
  - breakdown
  - chorus2
  - outro
