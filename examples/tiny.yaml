# Tiny: the smallest useful song, for quick checks. Eight bars of solo
# drums (no harmony needed). `fill_rate: 1.0` puts a fill at the end of
# every two bars (bars 2, 4 and 6), and the song ends cold on one crash hit
# in bar 8.
version: 1
song:
  project: produzre-examples
  title: "TinySong"
  bpm: 140
  key: E
  mode: dorian
  meter: "4/4"
  seed: 2
  exports_root: "exports"

exports:
  midi_text:
    enabled: true
    views: ["events", "grid", "tab"]
    subdiv: 16

instruments:
  drums:
    params:
      fill_rate: 1.0

sections:
  verse1:
    type: verse
    bars: 8
    instruments:
      drums: {}

arrangement:
  - verse1
