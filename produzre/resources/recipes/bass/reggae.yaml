# Reggae bass — hand-tuned 2026-06-10.
# The mined recipe had the lowest rest_rate of any bass genre (0.15) when
# reggae bass lives on silence: short, dubby phrases with deliberate holes,
# locked to the drop. Raised rests, lowered density, raised lock_to_kick.
id: reggae
instrument: bass
tags:
  genre: "reggae"
  time_signature: "4/4"
  bpm_range: [60, 131]
  section_types: [verse, chorus, bridge, default]
params:
  density: 0.5
  rhythm_pattern: "push"
  articulation_style: "mute"
  register_low: 28
  register_high: 52
  approach_rate: 0.2
  chromatic_rate: 0.05
  max_passing_per_bar: 2
  octave_jump_rate: 0.15
  fifth_jump_rate: 0.15
  rest_rate: 0.35  # the holes ARE the groove
  root_bias: 0.7
  motion_style: "mixed"
  swing: 0.1
  lock_to_kick: 0.8  # sit on the drop with the kick
  accent_strength: 1.3
  syncopation: 0.57  # corpus: reggae has the highest syncopation
