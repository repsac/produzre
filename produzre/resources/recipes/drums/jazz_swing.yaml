# Jazz swing drum recipe — retuned 2026-06-10.
# Ride cymbal timekeeping, sparse kick, brushy ghost notes, swing feel.
# Intended feel: triplet swing (2:1 long-short). Current engine semantics
# delay the "&" by 0.25*swing beats, so triplet placement (+0.167 beats)
# needs swing ~= 0.67; the old 0.30 was barely audible.
# hat_mode is 8th (ride on all 8 positions) because the engine cannot
# express the spang-a-lang skip pattern (ride on 1, 2, 2&, 3, 4, 4&);
# steady swung 8th ride is the closest available approximation.

id: jazz_swing
instrument: drums
tags:
  genre: jazz
  feel: swing
  time_signature: "4/4"
  section_types: [verse, chorus, bridge, solo]
  bpm_range: [100, 200]

groove:
  hat_mode: "8th"
  use_ride: true
  kick_base: [0]
  kick_extra_rate: 0.08
  double_kick_rate: 0.0
  snare_backbeat_steps: [4, 12]
  ghost_rate: 0.40
  ghost_steps: [2, 3, 6, 7, 9, 10, 14, 15]
  open_hat_rate: 0.05
  crash_start: false
  crash_phrase_end_rate: 0.10

params:
  fill_rate: 0.15
  swing: 0.65  # ~+0.16 beats on the "&" = triplet ride feel

voices:
  kick:
    syncopation: {rate: 0.08}
  snare:
    ghosts: {rate: 0.40}
  hats:
    pedal: {rate: 0.25}
