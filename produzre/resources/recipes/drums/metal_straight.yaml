# Metal (straight feel) drum recipe — hand-tuned 2026-06-10.
# Replaces a mined recipe whose kick_base covered all 16 sixteenth steps
# (a corpus-averaging artifact: blast beats + double kick smeared into a
# wall of kicks) and whose snare landed on beats 2+3+4.
# Idiom: gallop-flavored riff-cell kick, backbeat snare on 2 and 4,
# double-kick bursts driven by double_kick_rate (metal persona says 0.6).

id: metal_straight
instrument: drums
tags:
  genre: metal
  feel: straight
  time_signature: "4/4"
  section_types: [verse, chorus, bridge, solo]
  bpm_range: [120, 220]

groove:
  hat_mode: "8th"
  use_ride: true
  # Gallop riff cell: 1, 1a, 2&, 3, 3a, 4& (steps on the 16-step grid)
  kick_base: [0, 3, 6, 8, 11, 14]
  kick_extra_rate: 0.10
  double_kick_rate: 0.50
  snare_backbeat_steps: [4, 12]
  ghost_rate: 0.05
  ghost_steps: [7, 15]
  open_hat_rate: 0.05
  crash_start: true
  crash_phrase_end_rate: 0.30

params:
  fill_rate: 0.30

voices: {}
