# Big-band / swing-era drum recipe — hand-tuned 2026-06-10.
# The mined recipe had swing: 0.1 (inaudible), snare backbeats on noise
# steps [4, 8, 12, 15], and a stray double_kick_rate of 0.11.
# Idiom: ride-led swung 8ths, feathered-ish kick on 1 and 3, backbeat on
# 2 and 4. Intended feel: triplet swing (2:1); current engine semantics
# delay the "&" by 0.25*swing beats, so triplet placement needs ~0.67.

id: swing_swing
instrument: drums
tags:
  genre: swing
  feel: swing
  time_signature: "4/4"
  section_types: [verse, chorus, bridge, solo]
  bpm_range: [94, 268]

groove:
  hat_mode: "8th"
  use_ride: true
  kick_base: [0, 8]
  kick_extra_rate: 0.08
  double_kick_rate: 0.0
  snare_backbeat_steps: [4, 12]
  ghost_rate: 0.18
  ghost_steps: [3, 7, 9, 11]
  open_hat_rate: 0.0
  crash_start: false
  crash_phrase_end_rate: 0.05

params:
  swing: 0.65  # ~+0.16 beats on the "&" = triplet ride feel
  fill_rate: 0.15

voices: {}
