# Blues harmony recipe
# 12-bar blues and common blues progressions

id: blues
instrument: harmony
tags:
  genre: blues
  time_signature: "4/4"
  section_types: [verse, chorus, bridge]
  bpm_range: [60, 160]

progressions:
  minor:
    # 12-bar minor blues
    verse: ["i", "i", "i", "i", "iv", "iv", "i", "i", "V", "iv", "i", "V"]
    chorus: ["i", "iv", "i", "i", "iv", "iv", "i", "i", "V", "iv", "i", "i"]
    bridge: ["iv", "iv", "i", "i", "V", "iv", "i", "V"]
    default: ["i", "i", "i", "i", "iv", "iv", "i", "i", "V", "iv", "i", "V"]
  major:
    # 12-bar major blues
    verse: ["I", "I", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "V"]
    chorus: ["I", "IV", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "I"]
    bridge: ["IV", "IV", "I", "I", "V", "IV", "I", "V"]
    default: ["I", "I", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "V"]
  dorian:
    verse: ["i", "i", "i", "i", "IV", "IV", "i", "i", "V", "IV", "i", "V"]
    default: ["i", "i", "i", "i", "IV", "IV", "i", "i", "V", "IV", "i", "V"]
  mixolydian:
    verse: ["I", "I", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "V"]
    default: ["I", "I", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "V"]

params:
  chord_rate: 4.0
