# Latin harmony recipe
# Bossa nova, salsa, and Latin jazz influenced progressions

id: latin
instrument: harmony
tags:
  genre: latin
  time_signature: "4/4"
  section_types: [verse, chorus, bridge]
  bpm_range: [80, 160]

# Dominants spelled V7 (2026-06-10): bossa/salsa cadential V is a dominant 7th.
progressions:
  minor:
    verse: ["i", "bVII", "bVI", "V7"]
    chorus: ["bVI", "bVII", "i", "V7"]
    bridge: ["iv", "bVII", "bIII", "bVI"]
    default: ["i", "bVII", "bVI", "V7"]
  major:
    verse: ["I", "vi", "ii", "V7"]
    chorus: ["IV", "V7", "I", "vi"]
    bridge: ["ii", "V7", "iii", "vi"]
    default: ["I", "vi", "ii", "V7"]
  dorian:
    verse: ["i", "IV", "bVII", "bIII"]
    chorus: ["IV", "bVII", "i", "i"]
    bridge: ["bVII", "IV", "bIII", "bVI"]
    default: ["i", "IV", "bVII", "bIII"]

params:
  chord_rate: 4.0
