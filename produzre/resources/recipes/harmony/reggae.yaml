# Reggae harmony recipe
# Simple progressions emphasizing the offbeat rhythmic feel

id: reggae
instrument: harmony
tags:
  genre: reggae
  time_signature: "4/4"
  section_types: [verse, chorus, bridge]
  bpm_range: [60, 100]

progressions:
  minor:
    verse: ["i", "bVII", "bVI", "bVII"]
    chorus: ["bVI", "bVII", "i", "i"]
    bridge: ["bIII", "bVII", "i", "i"]
    default: ["i", "bVII", "bVI", "bVII"]
  major:
    verse: ["I", "IV", "V", "I"]
    chorus: ["I", "V", "vi", "IV"]
    bridge: ["vi", "IV", "I", "V"]
    default: ["I", "IV", "V", "I"]
  dorian:
    verse: ["i", "IV", "bVII", "i"]
    chorus: ["bVII", "IV", "i", "i"]
    default: ["i", "IV", "bVII", "i"]

params:
  chord_rate: 4.0
