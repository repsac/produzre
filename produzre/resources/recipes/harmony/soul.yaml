# Soul harmony recipe
# Gospel-influenced progressions, descending bass patterns

id: soul
instrument: harmony
tags:
  genre: soul
  time_signature: "4/4"
  section_types: [verse, chorus, bridge]
  bpm_range: [70, 120]

# Dominants spelled V7 (2026-06-10): gospel/soul cadential V is a dominant 7th.
progressions:
  minor:
    verse: ["i", "bVII", "bVI", "V7"]
    chorus: ["bVI", "bVII", "i", "V7"]
    bridge: ["iv", "bVII", "bIII", "V7"]
    default: ["i", "bVII", "bVI", "V7"]
  major:
    verse: ["I", "vi", "ii", "V7"]
    chorus: ["IV", "V7", "I", "vi"]
    bridge: ["ii", "V7", "vi", "IV"]
    default: ["I", "vi", "ii", "V7"]
  dorian:
    verse: ["i", "IV", "bVII", "bIII"]
    chorus: ["IV", "bVII", "i", "bIII"]
    default: ["i", "IV", "bVII", "bIII"]

params:
  chord_rate: 4.0
