# Jazz rhythm guitar recipe
# Sparse comping, shell voicings, laid-back swing feel

id: jazz
instrument: rhythm_gtr
tags:
  genre: jazz
  time_signature: "4/4"
  section_types: [verse, chorus, bridge]
  bpm_range: [80, 240]

params:
  style: half_time
  density: 0.35
  palm_mute: 0.0
  voicing: shell
  strum_style: balanced
  accent_strength: 0.3
  groove: laid_back
  swing: 0.2
  chuck_rate: 0.0
  strum_ms: 20.0
  use_patterns: true
